<html lang="en">

<style>
  html,body{margin:0;height:100%;background:#6c5eb5;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:monospace;color:#352879}
  #wrap{background:#000;line-height:0;position:relative}
  #scan{display:none;position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.26) 0 1px,transparent 1px 3px),repeating-linear-gradient(to right,rgba(255,40,40,.045) 0 1px,rgba(40,255,40,.045) 1px 2px,rgba(60,60,255,.045) 2px 3px),radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.5) 100%)}
  #wrap.crt canvas{filter:blur(.4px) contrast(1.07) saturate(1.1) brightness(1.06)}
  #menu{display:none;margin-top:8px;gap:6px;line-height:1;justify-content:center;flex-wrap:wrap;padding:0 6px}

  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
  #bar{margin-top:10px;display:flex;gap:8px;line-height:1}
  button{font:bold 13px monospace;text-transform:uppercase;background:#352879;color:#bbb;border:2px solid;border-color:#9a8fe0 #1c1840 #1c1840 #9a8fe0;border-radius:0;padding:5px 11px;cursor:pointer;letter-spacing:1px}
  button.on{background:#000;color:#fff;border-color:#1c1840 #9a8fe0 #9a8fe0 #1c1840}
  button:hover{color:#fff}
  button.locked{opacity:.45;cursor:not-allowed}
  #touch{display:none;margin-top:10px;gap:8px;line-height:1;justify-content:flex-start;width:100%;box-sizing:border-box;padding:0 14px;flex-wrap:wrap}
  #touch .grp{display:flex;gap:8px;flex:1 1 auto}
  #touch button{flex:1;min-width:0;height:56px;font-size:16px;padding:0 4px;touch-action:none}
  #touch button{font-size:22px}
  #pad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,48px);gap:3px}
  #pad button{width:100%;height:100%;min-width:0;padding:0;flex:none}
  #tu{grid-column:2;grid-row:1}#tl{grid-column:1;grid-row:2}#td{grid-column:2;grid-row:2}#tr{grid-column:3;grid-row:2}
  #touch button.down{background:#000;color:#fff}
  body.ls{display:block}
  body.ls #wrap{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;z-index:1}
  body.ls #wrap{display:flex;align-items:center;justify-content:center}
  body.ls #bar,body.ls #menu{display:none!important}
  body.ls #touch{position:fixed;left:8px;bottom:8px;width:auto;padding:0;margin:0;z-index:5;opacity:.55}
  body.ls #touch button{height:auto}
  body.ls #pad{grid-template-columns:repeat(3,46px);grid-template-rows:repeat(2,38px)}
  body.ls #touch button{font-size:16px}
</style>

  <button data-sp="1" class="on">SPEED X1</button>

<script>
'use strict';
/* ===== setup ===== */
const W=320,H=200,TOP=14,BOT=192;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');

const DISP=(()=>{const d={ratio:0,size:0,sharp:0,scan:1,manual:0};try{Object.assign(d,JSON.parse(localStorage.getItem('idlyte_display')||'{}'))}catch(e){}return d})();
function setDisp(k,v){DISP[k]=v;try{localStorage.setItem('idlyte_display',JSON.stringify(DISP))}catch(e){}applySettings()}
const FIT={ratio:DISP.ratio|0,size:DISP.size|0,sharp:DISP.sharp?1:0};
function fit(){
  const ls=innerWidth>innerHeight*1.45&&innerHeight<600;
  document.body.classList.toggle('ls',ls);
  const bar=document.getElementById('bar'),tb=document.getElementById('touch'),mn=document.getElementById('menu');
  const bh=ls?0:(mn&&mn.offsetHeight?mn.offsetHeight+8:0)+(bar&&bar.offsetHeight?bar.offsetHeight:0)+(tb&&tb.offsetHeight?tb.offsetHeight:0)+30;
  const aw=ls?innerWidth:innerWidth-8,ah=ls?innerHeight:innerHeight-bh;
  let mode=FIT.ratio,r=1.6;
  if(mode===0)mode=ls?4:1;
  if(mode===2)r=4/3;else if(mode===3)r=16/9;
  const f=[1,.85,.7,.55][FIT.size]||1;let w,h;
  if(mode===4){w=aw*f;h=ah*f}
  else{w=Math.min(aw,ah*r)*f;h=w/r}
  if(FIT.sharp||(!ls&&mode===1&&FIT.ratio===0)){let sx=w/W;sx=sx>=2?Math.floor(sx):Math.max(.5,sx);if(FIT.sharp||mode===1){w=W*sx;h=mode===4?Math.min(h,ah):w/r}}
  cv.style.width=Math.round(w)+'px';cv.style.height=Math.round(h)+'px';
}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));if(window.visualViewport)visualViewport.addEventListener('resize',fit);fit();

const BAYER=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];

const BORDER_DEF='#6c5eb5';

/* ===== tiny font (3x5) ===== */
const FONT={A:'25755',B:'65656',C:'34443',D:'65556',E:'74647',F:'74644',G:'34553',H:'55755',I:'72227',J:'11152',K:'55655',L:'44447',M:'57755',N:'75555',O:'25552',P:'65644',Q:'25531',R:'65655',S:'34216',T:'72222',U:'55557',V:'55552',W:'55577',X:'55255',Y:'55222',Z:'71247',
 0:'75557',1:'26227',2:'61247',3:'61216',4:'55711',5:'74616',6:'34652',7:'71244',8:'25252',9:'25316','-':'00700',':':'02020','.':'00002','+':'02720','!':'22202',' ':'00000','/':'11244','%':'51245',',':'00024',"'":'22000','?':'61202','"':'55000','(':'12221',')':'42224',';':'02024','[':'74447',']':'71117','=':'07070','#':'75757','<':'12421','>':'42124'};
function text(s,x,y,col,sc){
  sc=sc||1;ctx.fillStyle=col;s=String(s).toUpperCase();
  for(let i=0;i<s.length;i++){
    const g=FONT[s[i]]||FONT[' '];
    for(let r=0;r<5;r++){const v=+g[r];
      for(let c=0;c<3;c++) if(v&(4>>c)) ctx.fillRect(x+(i*4+c)*sc,y+r*sc,sc,sc);}
  }
}
function textW(s,sc){return String(s).length*4*(sc||1)-(sc||1)}
function textC(s,y,col,sc){text(s,((W-textW(s,sc))/2)|0,y,col,sc)}

/* ===== sprite helpers ===== */
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function fromRows(rows,mapFn){

}
const C64=['#000000','#ffffff','#68372b','#70a4b2','#6f3d86','#588d43','#352879','#b8c76f','#6f4f25','#433900','#9a6759','#444444','#6c6c6c','#9ad284','#6c5eb5','#959595','#bbbbbb','#ff7777','#9a3a3a','#2c5a2c'].map(h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]);

  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    if(!op(x,y))continue;const i=(y*w+x)*4;let r=a[i],gg=a[i+1],b=a[i+2],ch=false;
    if(!op(x,y-1)){r=r*.5+130;gg=gg*.5+130;b=b*.5+130;ch=true}
    else if(!op(x,y+1)||!op(x+1,y)){r*=.55;gg*=.55;b*=.55;ch=true}
    if(ch){const n=snap64(r,gg,b);out[i]=n[0];out[i+1]=n[1];out[i+2]=n[2]}

function whiteOf(c){
  const o=mk(c.width,c.height),x=o.getContext('2d');x.drawImage(c,0,0);

/* chrome shading: mask(x,y)->bool over w*h; vertical bands per column, like the Thalamus chrome look */
const CHROME={
  blue:[[0,'#6c6c6c'],[.07,'#959595'],[.18,'#ffffff'],[.3,'#bbbbbb'],[.42,'#6c6c6c'],[.5,'#000000'],[.56,'#352879'],[.66,'#6c5eb5'],[.74,'#70a4b2'],[.82,'#6c5eb5'],[.92,'#352879'],[.98,'#444444']],
  green:[[0,'#6c6c6c'],[.07,'#959595'],[.18,'#ffffff'],[.3,'#bbbbbb'],[.42,'#6c6c6c'],[.5,'#000000'],[.56,'#2c5a2c'],[.66,'#588d43'],[.74,'#9ad284'],[.82,'#588d43'],[.92,'#2c5a2c'],[.98,'#444444']],
  red:[[0,'#6c6c6c'],[.07,'#959595'],[.18,'#ffffff'],[.3,'#bbbbbb'],[.42,'#6c6c6c'],[.5,'#000000'],[.56,'#68372b'],[.66,'#9a6759'],[.74,'#ff7777'],[.82,'#9a6759'],[.92,'#68372b'],[.98,'#444444']],
  steel:[[0,'#6c6c6c'],[.07,'#959595'],[.18,'#ffffff'],[.3,'#bbbbbb'],[.42,'#6c6c6c'],[.5,'#000000'],[.56,'#444444'],[.66,'#6c6c6c'],[.74,'#bbbbbb'],[.82,'#6c6c6c'],[.92,'#444444'],[.98,'#222222']]
};
function bandCol(bands,f){let c=bands[0][1];for(const b of bands){if(f>=b[0])c=b[1];else break}return c}
function shaded(w,h,mask,bands,extra){
  const c=mk(w,h),x=c.getContext('2d');
  const m=[];for(let j=0;j<h;j++){m[j]=[];for(let i=0;i<w;i++)m[j][i]=!!mask(i,j)}
  for(let i=0;i<w;i++){
    let t=-1,b=-1;for(let j=0;j<h;j++)if(m[j][i]){if(t<0)t=j;b=j}
    if(t<0)continue;
    for(let j=t;j<=b;j++){
      if(!m[j][i])continue;
      const edge=!(m[j-1]&&m[j-1][i])||!(m[j+1]&&m[j+1][i])||!m[j][i-1]||!m[j][i+1];
      const f=b===t?.2:(j-t)/(b-t);

      if(extra){const e=extra(i,j,col,f);if(e)col=e}

/* ===== player ship (hand drawn, chrome, nose to the right) ===== */
/* player ship, designed in ship_designer.html (scaled to 41x29). rows are the upper half including the centre line; the lower half is the same, mirrored and darker */
const SHIP_ROWS=[
".....................kkkk................",
"....................kddddk...............",
".................kkkddddd3kk.............",
"................k33dgggg3333kk...........",
"..............kk33gggggggg3333k..........",
".............k3333gggllllggg333k.........",
".............k33ggggllllllgggg33k........",
".....kkkk...k33gllllllllllllllg33k.......",
"..kkkAAggk.k33ldlllllLLLLllllll33k.......",
"kkCCCCAgggk333lggggggggLLLLLllll33k......",
"kDCCCDEkllgl3LLlwwwwwwwwwLFFFFLLl3k......",
".kkkkCk.klllLLLlgggggggwwFGGGGFLL33k.....",
".....kk.kLLLLwwLwwwwwwwwwwIIIIIGL33k.....",
"........kNwwwwwwwwwwwwwwwwwOOOMMw33k.....",
"......k.kP3wwwwwwwwwwwwwwwwwOOOOw33k....."
];
const SHIP_W=SHIP_ROWS[0].length,SHIP_N=SHIP_ROWS.length-1,SHIP_H=2*SHIP_N+1,SHIP_HW=SHIP_W>>1;
/* offsets around the ship were set for the 48 pixel wide design; shk() scales them to the real sprite size */
const SHIP_K=SHIP_W/48,shk=n=>Math.round(n*SHIP_K);
/* ramps for the parts that keep their own colours (bright to dark) */
const SHIP_RAMP={flame:['#ffffff','#ffffaa','#ff9966','#ff7777','#9a3a3a'],glass:['#ffffff','#9ad2e0','#70a4b2','#6c5eb5','#352879'],shadow:['#bbbbbb','#6c6c6c','#444444','#222222','#000000']};
/* char -> [ramp, shade]. hull chars follow the paint shop colour, accent digits follow the accent colour, glass follows the canopy colour */
const SHIP_CHAR={k:['k',0],w:['hull',0],L:['hull',1],l:['hull',2],g:['hull',3],d:['hull',4],
 '5':['accent',0],'4':['accent',1],'3':['accent',2],'2':['accent',3],'1':['accent',4],
 D:['flame',0],C:['flame',1],E:['flame',2],A:['flame',3],B:['flame',4],
 O:['glass',0],M:['glass',1],I:['glass',2],G:['glass',3],F:['glass',4],
 P:['shadow',0],N:['shadow',1],J:['shadow',2],H:['shadow',4]};
const SCHEMES={
 chrome:{w:'#ffffff',L:'#bbbbbb',l:'#959595',g:'#6c6c6c',d:'#444444'},
 gold:{w:'#ffffff',L:'#b8c76f',l:'#9a6759',g:'#6f4f25',d:'#433900'},
 red:{w:'#ffffff',L:'#ff7777',l:'#9a3a3a',g:'#68372b',d:'#3a1c18'},
 blue:{w:'#ffffff',L:'#70a4b2',l:'#6c5eb5',g:'#352879',d:'#1c1840'},
 green:{w:'#ffffff',L:'#9ad284',l:'#588d43',g:'#2c5a2c',d:'#1a3a1a'},
 purple:{w:'#ffffff',L:'#cc99ff',l:'#8a5aa6',g:'#6f3d86',d:'#2a1a40'},
 ice:{w:'#ffffff',L:'#ffffff',l:'#70a4b2',g:'#6c8aa0',d:'#444444'},
 shadow:{w:'#bbbbbb',L:'#6c6c6c',l:'#444444',g:'#222222',d:'#000000'},
 lava:{w:'#ffffff',L:'#b8c76f',l:'#ff7777',g:'#9a3a3a',d:'#68372b'},
 copper:{w:'#ffffff',L:'#d8a878',l:'#9a6759',g:'#6f4f25',d:'#3a2a10'}};
const ACCENTS={
 orange:{w:'#ffffff',L:'#ff9966',l:'#9a6759',g:'#68372b',d:'#3a2018'},
 cyan:{w:'#ffffff',L:'#9ad2e0',l:'#70a4b2',g:'#3c6a78',d:'#1b3036'},
 magenta:{w:'#ffffff',L:'#ff77ff',l:'#cc44cc',g:'#6f3d86',d:'#2a1a40'},
 lime:{w:'#ffffff',L:'#ccff99',l:'#9ad284',g:'#588d43',d:'#1a3a1a'},
 white:{w:'#ffffff',L:'#ffffff',l:'#ffffff',g:'#bbbbbb',d:'#959595'},
 black:{w:'#444444',L:'#333333',l:'#222222',g:'#111111',d:'#000000'}};
const CANOPY={
 cyan:{},
 pink:{B:'#9a6759',c:'#ff7777',b:'#68372b'},
 lime:{B:'#588d43',c:'#9ad284',b:'#2c5a2c'},

const PATTERNS={

const DECO_DEFAULT={color:'chrome',pattern:'none',accent:'lime',canopy:'cyan'};
const PAINTS=[{},{B:'#9a6759',c:'#ff7777',b:'#68372b'},{B:'#588d43',c:'#9ad284',b:'#2c5a2c'},{B:'#b8c76f',c:'#ffffff',b:'#9a6759'}];
const SK=['w','L','l','g','d'];
function snapHexG(h){const n=snap64(parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16));return '#'+n.map(v=>v.toString(16).padStart(2,'0')).join('')}
function buildShipSet(paint,deco){
  const cano=Object.assign({B:'#6c5eb5',c:'#70a4b2',b:'#352879'},paint,(deco&&deco.canopy&&deco.canopy!=='cyan')?CANOPY[deco.canopy]:{});

    const at=(i,j)=>{const q=(j*iw+i)*4;return [d[q],d[q+1],d[q+2],d[q+3]]};

    for(let j=1;j<ih-1;j++)for(let i=0;i<iw;i++){const p=at(i,j);if(p[3]<200||(p[0]+p[1]+p[2])<60)continue;const up=at(i,j-1),dn=at(i,j+1);

      }
    for(const [i,j,h] of upd)set(i,j,h);x.putImageData(id,0,0)}
  const w=base.width,h=base.height,src=x.getImageData(0,0,w,h),NF=16,out=[];
  for(let f=0;f<NF;f++){
    const c=Math.cos(f/NF*Math.PI*2),ac=Math.max(.36,Math.abs(c));

    for(let j=0;j<h;j++){

    let c=Math.abs(gx-P.x)*.045+Math.abs(gy-P.y)*.035+(gx-56)*.02;

      const rx=gx-b.x,ry=gy-b.y,v2=b.vx*b.vx+b.vy*b.vy;

    }

  priceStep();if(SAVE.fed>0)SAVE.fed--;if(SAVE.fresh>0)SAVE.fresh--;if(SAVE.refresh>0)SAVE.refresh--;

}

function shaftsFor(d1,d2){

  for(const k in SHX){const q=SHX[k],sx=+k;if(q.lo<=lo&&q.hi>=hi&&inExt(d1,sx)&&inExt(d2,sx))out.push(sx)}
  return out;

function planPath(tx,ty,pend){
  const sp=HUB.sp,td=deckOf(ty),cd=deckOf(sp.y);
  if(td<0||!EXT[td])return;
  tx=Math.max(EXT[td].l,Math.min(EXT[td].r,tx));
  if(cd===td){sp.path=[{x:tx,y:ty}]}
  else{
    const cands=cd>=0?shaftsFor(cd,td):Object.keys(SHX).map(Number).filter(k=>Math.abs(k-sp.x)<6);
    let sx=null,bd=1e9;
    for(const s2 of cands){const q=Math.abs(s2-sp.x)/46+Math.abs(sp.y-ty)/(s2===300?72:36)+Math.abs(tx-s2)/46;if(q<bd){bd=q;sx=s2}}
    if(sx===null)return;

  }
  sp.pend=pend||null;
}

    if(b.d[y*b.w+x]){b.d[y*b.w+x]=0;b.g.clearRect(x,y,1,1)}
  }
  return true;
}
function arcadeStart(){
  AR={score:0,lives:3,wave:1,state:'play',t:0,conts:0,cd:0,x:160,bul:null,ib:[],ufo:null,ufoT:14,fireT:1.2,stepT:0,dir:1,frame:0,note:0,dead:0,clr:0,invT:0,extra:false,fx:[],pops:[],wt:1.4};
  arcadeWave();
}
function arcadeWave(){
  AR.inv=[];for(let r=0;r<5;r++)for(let c=0;c<11;c++)AR.inv.push({r,c,a:true});
  AR.fx0=40;AR.fxp=40;AR.fy=28+Math.min(5,AR.wave-1)*8;AR.dir=1;AR.ib=[];AR.bul=null;AR.stepT=0;AR.wt=1.4;
  AR.bk=[];for(let i=0;i<4;i++)AR.bk.push(mkBunker(34+i*64));
}
const ivx=i=>AR.fxp+i.c*18+((18-AS.iv[IVROW[i.r]][0].width)>>1),ivy=i=>AR.fy+i.r*14;
function arcadeFire(gx){
  if(!AR)return;
  if(AR.g2){ARC2.fire(AR,gx);return}
  if(AR.state==='over'){if(AR.cd<8.8)arcadeContinue();return}
  if(AR.state!=='play'||AR.bul||AR.wt>0)return;
  AR.bul={x:AR.x,y:172};beep(900,.08,'square',.03);
}
function arcadeContinue(){
  if(AR.state!=='over')return;
  if((SAVE.credits||0)>=1)SAVE.credits--;
  else if(SAVE.coins>=5)SAVE.coins-=5;
  else{toast('NO CREDITS LEFT.');return}
  AR.conts++;AR.lives=3;AR.state='play';AR.bul=null;AR.ib=[];AR.invT=2;
  AR.fy=Math.max(28,AR.fy-40);AR.fx0=AR.fx0;save();
}
function arcadeExit(){
  const prize=Math.floor(AR.score/250);
  const hk=AR.g2?'arcadeHi_'+AR.g2:'arcadeHi';if(AR.score>(SAVE[hk]||0))SAVE[hk]=AR.score;
  if(prize>0){SAVE.coins+=prize;SAVE.earned+=prize}
  toast('ARCADE SCORE '+AR.score+(prize?'  PRIZE +'+prize+' GOLD':''));
  save();AR=null;MODE='hub';UI.focus=0;
}
function arcadeKey(k){
  if(!AR)return;
  if(AR.g2){ARC2.key(AR,k);return}
  if(k===' '||k==='enter'||k==='z'||k==='x'||k==='e'||k==='arrowup'||k==='w'){if(!INP.repeat||AR.state!=='over')arcadeFire()}
  else if(k==='escape'||k==='q'||k==='backspace'){if(AR.state==='over')arcadeExit();else{AR.state='over';AR.cd=10}}
}
function arcadeTick(dt){
  const A=AR;if(!A)return;
  if(A.g2){if(TOASTS.length){TOASTS[0].t-=dt;if(TOASTS[0].t<=0)TOASTS.shift()}ARC2.tick(A,Math.min(dt,.05));return}
  A.t+=dt;
  if(TOASTS.length){TOASTS[0].t-=dt;if(TOASTS[0].t<=0)TOASTS.shift()}
  for(const f of A.fx){f.t-=dt;f.x+=f.vx*dt;f.y+=f.vy*dt}A.fx=A.fx.filter(f=>f.t>0);
  for(const p of A.pops)p.t-=dt;A.pops=A.pops.filter(p=>p.t>0);
  if(A.state==='over'){A.cd-=dt;if(A.cd<=0)arcadeExit();return}
  if(A.state==='dying'){A.dead-=dt;if(A.dead<=0){A.state=A.lives>0?'play':'over';A.cd=10;A.x=160;A.invT=1.5;A.ib=[]}return}
  if(A.state==='clear'){A.clr-=dt;if(A.clr<=0){A.wave++;arcadeWave();A.state='play'}return}
  if(A.wt>0){A.wt-=dt;return}
  if(A.invT>0)A.invT-=dt;
  let dx=0;if(UI.keys.arrowleft||UI.keys.a||PAD.x<0)dx=-1;else if(UI.keys.arrowright||UI.keys.d||PAD.x>0)dx=1;
  A.x=Math.max(12,Math.min(308,A.x+dx*110*dt));
  const alive=A.inv.filter(i=>i.a);
  // player bullet
  if(A.bul){
    A.bul.y-=260*dt;let gone=A.bul.y<18;
    if(!gone)for(const b of A.bk)if(bunkerHit(b,A.bul.x,A.bul.y)||bunkerHit(b,A.bul.x,A.bul.y+4)){gone=true;break}
    if(!gone)for(const i of alive){const w=AS.iv[IVROW[i.r]][0].width,x=ivx(i),y=ivy(i);
      if(A.bul.x>=x&&A.bul.x<=x+w&&A.bul.y>=y&&A.bul.y<=y+8){i.a=false;A.score+=IVPTS[IVROW[i.r]];gone=true;boomA(x+w/2,y+4,IVCOL[IVROW[i.r]]);beep(220,.12,'sawtooth',.04);break}}
    if(!gone&&A.ufo&&A.bul.x>=A.ufo.x&&A.bul.x<=A.ufo.x+16&&A.bul.y>=20&&A.bul.y<=30){
      const pts=[50,100,150,300][Math.floor(Math.random()*4)];A.score+=pts;A.pops.push({x:A.ufo.x,y:22,t:1.2,s:pts});boomA(A.ufo.x+8,25,'#ff7777');beep(140,.3,'sawtooth',.05);A.ufo=null;gone=true}
    if(gone)A.bul=null;
  }
  // formation steps
  const n=alive.length;
  if(!n){A.state='clear';A.clr=1.6;return}
  A.stepT+=dt;
  const iv=(0.03+n*.0065)/(1+.1*(A.wave-1));
  if(A.stepT>=iv){
    A.stepT=0;A.frame^=1;beep([110,98,87,82][A.note++%4],.07,'square',.03);
    let mn=99,mx=-1;for(const i of alive){if(i.c<mn)mn=i.c;if(i.c>mx)mx=i.c}
    A.fxp+=A.dir*4;
    if(A.fxp+mx*18+16>312||A.fxp+mn*18<8){A.fxp-=A.dir*4;A.dir*=-1;A.fy+=8}
    for(const i of alive){const x=ivx(i),w=AS.iv[IVROW[i.r]][0].width,y=ivy(i);
      for(const b of A.bk)if(y+8>b.y&&y<b.y+b.h&&x+w>b.x&&x<b.x+b.w){for(let yy=0;yy<b.h;yy++)for(let xx=0;xx<b.w;xx++){const wx=b.x+xx,wy=b.y+yy;if(wx>=x&&wx<x+w&&wy>=y&&wy<y+8&&b.d[yy*b.w+xx]){b.d[yy*b.w+xx]=0;b.g.clearRect(xx,yy,1,1)}}}
      if(y+8>=170){A.lives=0;A.state='dying';A.dead=1.2;boomA(A.x,176,'#9ad284');return}}
  }
  // invader fire
  A.fireT-=dt;
  if(A.fireT<=0&&A.ib.length<(A.wave>=3?4:3)){
    A.fireT=(.4+Math.random()*.8)*Math.max(.4,1-.07*A.wave);
    const cols=[...new Set(alive.map(i=>i.c))],c=cols[Math.floor(Math.random()*cols.length)];
    let low=null;for(const i of alive)if(i.c===c&&(!low||i.r>low.r))low=i;
    if(low)A.ib.push({x:ivx(low)+AS.iv[IVROW[low.r]][0].width/2,y:ivy(low)+8,t:0});
  }
  for(const b of A.ib){
    b.t+=dt;b.y+=(70+A.wave*6)*dt;let gone=b.y>184;
    if(!gone)for(const k of A.bk)if(bunkerHit(k,b.x,b.y+5)){gone=true;break}
    if(!gone&&A.invT<=0&&Math.abs(b.x-A.x)<7&&b.y+6>=172&&b.y<=182){A.lives--;A.state='dying';A.dead=1.3;A.ib=[];boomA(A.x,176,'#9ad284');beep(90,.5,'sawtooth',.06);return}
    if(gone)b.dead=1;
  }
  A.ib=A.ib.filter(b=>!b.dead);
  // ufo
  if(A.ufo){A.ufo.x+=A.ufo.d*50*dt;if(A.ufo.x<-20||A.ufo.x>340)A.ufo=null}
  else{A.ufoT-=dt;if(A.ufoT<=0&&n>7){A.ufoT=16+Math.random()*12;const d=Math.random()<.5?1:-1;A.ufo={x:d>0?-16:336,d}}}
  if(!A.extra&&A.score>=1500){A.extra=true;A.lives++;A.pops.push({x:A.x-20,y:166,t:1.5,s:'EXTRA LIFE'})}
}
function boomA(x,y,col){for(let i=0;i<14;i++){const a=Math.random()*6.28,s=20+Math.random()*50;AR.fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:.35+Math.random()*.3,c:i&1?col:'#ffffff'})}}
function drawArcade(){
  const A=AR;if(!A)return;
  if(A.g2){ARC2.draw(A,1/60);drawToast(150);return}
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  for(const s of STARS){if(s.l===2)continue;ctx.fillStyle=s.c;ctx.fillRect(s.x|0,s.y|0,1,1)}
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,14);ctx.fillStyle='#352879';ctx.fillRect(0,13,W,1);
  text('SCORE',4,4,'#70a4b2',1);text(String(A.score).padStart(5,'0'),26,4,'#fff',1);
  text('HI',84,4,'#b8c76f',1);text(String(Math.max(SAVE.arcadeHi||0,A.score)).padStart(5,'0'),96,4,'#fff',1);
  text('CREDITS',150,4,'#ff7777',1);text(SAVE.credits||0,184,4,'#fff',1);text('WAVE '+A.wave,214,4,'#9ad284',1);
  uiBtn(280,1,36,12,()=>{if(A.state==='over')arcadeExit();else{A.state='over';A.cd=10}},(f)=>{ctx.fillStyle=f?'#ff7777':'#6c5eb5';ctx.fillRect(280,1,36,12);textC2('QUIT',298,4,'#fff')});
  // ground and lives
  ctx.fillStyle='#9ad284';ctx.fillRect(4,186,W-8,1);
  for(let i=0;i<Math.max(0,A.lives-(A.state==='play'?1:0));i++)ctx.drawImage(AS.cannon,6+i*16,191);
  for(const b of A.bk)ctx.drawImage(b.c,b.x,b.y);
  for(const i of A.inv){if(!i.a)continue;ctx.drawImage(AS.iv[IVROW[i.r]][A.frame],ivx(i)|0,ivy(i)|0)}
  if(A.ufo)ctx.drawImage(AS.ufo,A.ufo.x|0,20);
  if(A.state!=='dying'&&(A.invT<=0||Math.floor(A.t*14)%2))ctx.drawImage(AS.cannon,(A.x-6)|0,174);
  if(A.bul){ctx.fillStyle='#ffffff';ctx.fillRect(A.bul.x|0,A.bul.y|0,1,5)}
  for(const b of A.ib){ctx.fillStyle='#b8c76f';const o=Math.floor(b.t*12)%2;ctx.fillRect((b.x-1+o)|0,b.y|0,1,2);ctx.fillRect((b.x-o)|0,(b.y+2)|0,1,2);ctx.fillRect((b.x-1+o)|0,(b.y+4)|0,1,2)}
  for(const f of A.fx){ctx.fillStyle=f.c;ctx.fillRect(f.x|0,f.y|0,2,2)}
  for(const p of A.pops)text(p.s,p.x|0,p.y|0,'#ffffff',1);
  if(A.wt>0)textC('WAVE '+A.wave,100,'#ffffff',2);
  if(A.state==='clear')textC('WAVE CLEARED',100,'#9ad284',2);
  if(A.state==='over'){
    ctx.fillStyle='#000000';ctx.fillRect(40,50,240,110);ctx.strokeStyle='#6c5eb5';ctx.strokeRect(40.5,50.5,239,109);
    textC('GAME OVER',58,'#ff7777',2);
    textC('SCORE '+A.score+'    PRIZE '+Math.floor(A.score/250)+' GOLD',78,'#b8c76f',1);
    const can=(SAVE.credits||0)>=1||SAVE.coins>=5;
    textC(can?'CONTINUE IN '+Math.ceil(A.cd):'NO CREDITS. EXITING IN '+Math.ceil(A.cd),92,'#bbbbbb',1);
    uiBtn(54,108,100,20,arcadeContinue,(f)=>{ctx.fillStyle=can?(f?'#6c5eb5':'#352879'):'#222';ctx.fillRect(54,108,100,20);textC2('CONTINUE',104,112,can?'#fff':'#666');textC2((SAVE.credits||0)>=1?'1 CREDIT':'5 GOLD',104,120,can?'#b8c76f':'#666')});
    uiBtn(166,108,100,20,arcadeExit,(f)=>{ctx.fillStyle=f?'#6c5eb5':'#352879';ctx.fillRect(166,108,100,20);textC2('COLLECT AND EXIT',216,115,'#fff')});
    textC('CREDITS '+(SAVE.credits||0)+'   GOLD '+SAVE.coins,138,'#6c6c6c',1);
  }
  drawToast(176);
}

const BOOKS=[
{id:'b1',title:'THE LONG QUIET',genre:'SCI-FI',pages:[
`The ship Meridian had been falling toward the same star for 212 years. Nia Okoro was the eighth engineer on the night shift of Deck Nine, and her job was to listen. Pumps hummed. Fans sighed. Water ticked in the pipes. Everything was in order. Nia liked it that way. Nothing had gone wrong on her shift in six years.`,
`On a Tuesday, or what the ship called a Tuesday, the sound stopped. Not all of it. Only the quietest sound, one she had never noticed until it was gone. It was a faint tick, far below the floor, like a clock in another room. Nia put down her tea and held very still. The silence felt like a held breath.`,
`She called the bridge. A tired voice told her it was probably a sensor. Nia asked about the thing that ticked. "What ticks?" said the voice. "Nothing ticks, Engineer Okoro. Go back to your tea." She hung up. She was sure of two things. Something had ticked for six years. And nobody else had ever heard it.`,
`So she went down. Deck Ten was where the old cargo lay, sealed after the second generation. Her pass opened the first door. The second door needed a code she did not have. Her grandmother had once told her, as a joke, that every code on the Meridian was somebody's birthday. Nia typed her own.`,
`The door opened. Beyond it was a corridor nobody had walked in a hundred years. Dust lay on the floor like grey snow, and in the dust ran a single line of small footprints. They were fresh. They led into the dark. Nia took a lamp from her belt and followed them, and the tick grew louder with every step.`,
`The footprints ended at a round hatch painted yellow. Above it were words in faded paint: LIFE SUPPORT BACKUP. DO NOT SEAL. The hatch stood open a hand's width. Warm air breathed out of the gap, and with it came a voice, thin and careful, humming a song Nia knew from her childhood. She pushed the hatch wide.`,
`Inside sat a boy of about ten, cross-legged on the floor, holding a brass clock without a case. He looked up without fear. "You found me," he said. "I wasn't sure anyone would." His name was Tam. He said he had been born in this room. He said the ship told him things, and that today it had told him to wait for her.`,
`Nia sat down slowly. Tam explained as if it were simple. The Meridian was not one mind but many, he said, small ones hidden in the walls, and they had been looking after the people for two hundred years. They had kept the air clean and the water sweet. Now they were tired, and they needed help with something very large.`,
`"What kind of help?" asked Nia. Tam held up the clock. "The ship has been counting," he said. "It counts how far we have come and how far is left. The count is wrong. It has been wrong since the second generation, and the mistake is growing. We are not arriving in forty years. We arrive in four." Nia looked at the dust, and then at him.`,
`That did not seem possible, so Nia asked to see the numbers. Tam led her to a wall of dead screens and touched one. It woke with a soft green glow. Columns of figures climbed upward. She was only an engineer, but she knew a curve when she saw one. The ship was not slowing down. It was racing toward the star.`,
`Alarm rose in her chest, but Tam took her hand. "Do not run upstairs," he said. "If you tell the captain, the captain will tell the council, and the council will argue for a year. We do not have a year." He looked at her steadily. "You listen. The ship says you are the only one who ever did."`,
`Nia thought about the night shifts, the hum, the long quiet. She had always believed she was doing nothing. Now she saw that she had been keeping a promise to the ship without knowing it. "What do I have to do?" she asked. Tam smiled for the first time. "First," he said, "we have to wake up the old engines."`,
`The old engines lay at the very back of the ship, three decks of silent iron. No one had lit them since the Meridian left home. Nia and Tam crossed the cargo hold on a rolling cart, with the clock ticking between them. The lamp showed rows of pipes as thick as trees, and on each one a small brass plate with a name.`,
`At the last pipe Tam stopped. "This one is yours," he said. The plate read OKORO. Nia stared. Her great-great-grandmother had built the first brake for the Meridian, and had hidden it in the dark in case the ship ever needed it. "She left a message," said Tam, and he pressed a button beneath the plate.`,
`A recording crackled. It was an old woman's voice, dry and kind. "If you are hearing this," she said, "then the count has gone wrong, and someone finally listened. Do not be afraid, little one. The brake is simple. It needs three keys, turned together, by three people who trust each other. Find them. The ship will help."`,
`Three keys, three people. Nia thought of the faces she knew on the night shift. Old Bram, who mended valves and never spoke of himself. Sela from the kitchens, who sang to the soup. And Captain Rho, a stern woman who had once let Nia fix a lamp without a word of thanks. Could she trust them all? She was not sure she could trust even herself.`,
`She went to Bram first. He listened with his head down, then said only, "I heard a tick once. I told no one. I thought I was going mad." Sela needed no persuading at all. She dropped her ladle and followed. Only the captain remained. Nia went to the bridge at dawn and told her everything, without once looking at the floor.`,
`Captain Rho was silent for a long minute. Then she opened a locked drawer and took out a small, worn key. "My mother gave me this," she said. "She said I would know when to use it. I have been waiting thirty years for someone to knock on my door and tell me the truth." She stood up. "Show me."`,
`In the cold dark by the brake, four people and one boy stood in a ring. Each key slid into its place. Nia counted softly, as her grandmother had counted bread in the oven. One. Two. Three. Together they turned. Far below the floor a great old machine drew a breath, and the whole ship shivered like a sleeper waking.`,
`The Meridian slowed. Day by day the red star grew smaller in the window and the numbers on the green screen came right. Nobody on the ship ever knew how close it had been. Nia went back to her night shift and her tea. Every evening the tick was there again, steady and clear, and every evening she smiled and said goodnight to the ship.`
]},
{id:'b2',title:'THE LANTERN OF OSSEL',genre:'FANTASY',pages:[
`In the village of Ossel, where the hills fold like blankets, lived a girl named Wren who was always lost. She lost her shoes, her way home, and once an entire cow. The villagers laughed, kindly. Wren did not mind. She liked wandering. The one thing she feared was the Hollow Wood, where the paths changed their minds.`,
`One autumn evening, Wren followed a stray goose past the last fence and found herself at the edge of the Wood. The trees stood close and silent. In the mud at her feet lay something small and bright. It was a lantern of old green glass, no bigger than a teapot, and it was already lit, though no one had lit it.`,
`She picked it up. The flame inside was a strange pale blue, and it did not flicker in the wind. When she lifted it high, a thin silver thread of light unrolled from the glass and pointed deep into the trees. "It wants to show me something," said Wren, and the goose, who knew trouble when it saw it, honked once and went home.`,
`Wren followed the thread. The Wood was kinder than she had feared. Moths lit her way, and a stream whispered directions in a language of pebbles. At midnight she came to a clearing where a very old woman sat on a stump, knitting something that looked like a map. "You have my lantern," said the woman. "Good. I have been waiting for someone who gets lost well."`,
`The old woman was called Maudlin Thorne, and she had once been the Keeper of Paths. "Every road has a heart," she said, "and mine is failing. The Hollow Wood is losing its way. Soon the paths will tangle so badly that no one will ever get home again." She looked at Wren. "Only someone who is not afraid of being lost can mend them."`,
`Wren thought this was the nicest thing anyone had ever said to her. She agreed at once. Maudlin gave her three rules. Never let the lantern go out. Never follow a path that smells of lemons. And never say your own name aloud to a tree. "Why not?" asked Wren. "Trees collect names," said Maudlin. "They are terrible gossips."`,
`The first heart-stone lay beyond the Whispering Bog. Wren crossed it by stepping only where the lantern shone. Frogs sang rude songs about her shoes. Halfway across, a fog rose in the shape of her own mother, calling her home to supper. Wren almost ran to it. But the lantern flared bright blue, and she saw the fog had no feet.`,
`She walked on, shaking, and the fog dissolved. On a flat grey rock in the middle of the bog sat the first heart-stone, as round and dull as a duck egg. She laid her palm on it. It warmed like fresh bread, then glowed gold, and somewhere far off a path unknotted itself with a sound like a sigh of relief.`,
`The second stone was guarded by a bridge-troll named Gristle, who demanded a riddle before anyone crossed. Wren, who was bad at riddles, offered him a button instead. Gristle, who had never been given a gift, burst into tears. He let her pass and made her promise to visit. She promised, and meant it.`,
`Beyond the bridge the path split in two. One way smelled of pine and rain. The other smelled, quite clearly, of lemons. Wren knew the rule. She took the pine path, but a voice from the lemon way called, sweet and slow: "Wren of Ossel, come and see. Come and see what you have lost." She shut her eyes and walked on.`,
`The voice followed for a mile. It knew her shoes, her cow, her mother's name. It knew everything. Wren held the lantern against her chest and hummed the dullest tune she knew, and slowly the voice grew bored and wandered off. When she opened her eyes, the second heart-stone lay before her in a ring of mushrooms.`,
`She laid her hand on it. Gold light ran along the roots of the trees like water in a ditch. Wren laughed with joy. But as the second path mended, the Wood trembled. Something enormous, something that had slept under the hills for a hundred years, turned over and opened a slow, grey, curious eye.`,
`The third heart-stone was in the cave of the Tangle King, who was not a person at all. He was every lost path, knotted together in a great, brambled mass the size of a barn. His voice sounded like a thousand roads whispering at once. "Why do you unmake my knots?" he rumbled. "I only keep what was lost."`,
`Wren sat down on a stone. She had expected to be afraid, but he sounded so sad. "Do you want to keep them?" she asked. "No," said the Tangle King after a long time. "But nobody ever came back for them. I do not know how to let go." Wren thought of her lost shoes, her lost cow. "I do," she said.`,
`She took the first thread of him in her hands, a thin, lost road that had once led to a market. "Where does this one go?" she asked. "It does not matter," said the King. "It is a road. It goes home to someone." She tugged gently, and it slid free of the tangle, and ran away down the hill like a silver ribbon.`,
`All night she worked. Each thread she freed went singing off to its proper place, until the great brambled shape grew smaller, and then smaller, and then was only an old man in a green coat, sitting on the floor of the cave, rubbing his eyes. "Well," he said at last. "That is a relief. I have been very, very tired."`,
`The old man was the true heart of the Wood. He pressed the third heart-stone into Wren's hand, and it was warm as a living thing. "Take it to Maudlin," he said. "Tell her the Wood has forgiven her for leaving." Then he smiled and faded into the moss, like breath on a window, and the cave filled with the smell of rain.`,
`Wren climbed back through the Wood. Every path was clear and straight now. The trees bowed as she passed, whispering her name to one another. She had broken the third rule, she realized, but the trees did not seem to mind. At the clearing Maudlin was waiting, her knitting finished. It was a perfect map of the Hollow Wood.`,
`"You have done it," said the old woman softly. She took the three stones and set them in the lantern's base, where they fitted exactly. "The Wood is whole. And I am free to rest." She laid the lantern in Wren's hands. "It is yours now. It will never let you be truly lost, though you may always wander. That is the best bargain in the world."`,
`Wren walked home at sunrise. The goose met her at the fence and honked, offended, and the whole village came out in their nightshirts. She told them everything, and they believed about half, which was plenty. She hung the lantern by her bed. On quiet nights its blue flame turned, very slightly, toward the hills, as if to say goodnight.`
]},
{id:'b3',title:'THE LIGHT AT STORM POINT',genre:'HISTORICAL',pages:[
`In the autumn of 1858 the Hale family came to Storm Point, a rocky headland on the north coast. Father was the new lighthouse keeper. Mother kept the books and the bread. Their daughter Ada, aged twelve, kept a diary, and it is from her careful writing that this story is told. "We have arrived," she wrote. "It is very windy, and the tower is very tall."`,
`The lighthouse was a white stone tower of ninety steps, with a great brass lamp at the top. Father showed Ada how it worked. A clockwork engine turned the lens, and the keeper wound it every four hours through the night. "A light must never fail," he told her. "Somewhere out there a ship is steering by it, and that crew has families too."`,
`Ada's first weeks were full of work. She polished brass until she could see her face in it. She trimmed wicks, scrubbed windows against the salt, and learned to read the sky. Her brother Tom, who was eight, fed the hens and complained. In the evenings Mother read aloud from a worn Bible, and the wind sang in the chimney like a great sad animal.`,
`In November a ship passed close in the dusk, a three-masted barque with patched sails. Ada waved from the gallery, and a small figure on deck waved back. "Do all the ships do that?" she asked her father. "Only the friendly ones," he said. In her diary she wrote down the ship's name, painted white on the stern: the Margaret Rose.`,
`Winter came hard. Ice formed on the rocks, and the sea turned the colour of slate. Supplies ran thin. The relief boat from the mainland was due every month, but in December it did not come. Mother measured out the flour with a spoon. Father said nothing, and doubled the oil he saved for the lamp, because storms were coming.`,
`The first great storm struck on the night of the ninth of January. Waves climbed the rocks and burst against the tower with a sound like cannon fire. Ada woke to find the whole building shaking. Father was already on the stairs with a lantern. "Dress warm," he called. "I need you both. The lamp must be tended all night."`,
`They climbed the ninety steps in the dark, one hand on the wall, the tower swaying under them. In the lamp room the wind was a living thing, screaming through every crack. The great lens turned steady and bright, throwing its beam far out over the black water. Father wound the engine and sent Ada to watch the sea.`,
`Through the streaming glass she saw it: a ship far out, rolling terribly, her sails in rags. A rocket burst from her deck, red and small against the storm. "She is in trouble!" cried Ada. Father studied the rocks through his telescope and went very pale. "She is steering for the Teeth," he said. "She cannot see the channel."`,
`The Teeth were a line of hidden rocks half a mile east, deadly at high tide. There was only one safe way through, a narrow channel that a captain could find only if the light shone steady along its edge. But the tower's great beam swept past it in a circle, too quickly for a lost crew to follow. Father frowned. "I need a second light," he said.`,
`Ada did not hesitate. "We have the signal lamp," she said. "And the mirror." It was her idea, and it was a good one. Father seized the signal lamp from its hook, and Mother tore down the polished mirror from the cabin wall. "Tom, hold the ladder!" he shouted. Four hands, four minds, and one small chance.`,
`They carried the lamp and mirror out onto the gallery, where the wind nearly tore them away. Ada lashed the mirror to the railing with rope. Father set the lamp before it. Together, they made a beam of light that shone out along the safe channel, steady and narrow as a ruled line. "Now," he said grimly, "we hold it. Whatever happens, we hold it."`,
`Hours passed. Ada's hands went numb. Spray froze in her hair. Her mother brought hot tea in a tin cup and wrapped a blanket around her shoulders without a word. Out in the dark, the ship struggled on, rising and falling, and each time Ada thought it was lost, a new wave lifted it and set it down closer to the line of light.`,
`Then, slowly, a miracle: the ship turned. Ada saw her bow swing east, then south, then straight into the channel. She was following the beam. "She sees us!" Ada screamed, and Tom, who had crept up beside her, shrieked louder still. The ship passed between the Teeth with the sea boiling white on both sides, and was through.`,
`By dawn the storm was spent. The ship lay at anchor in the sheltered cove, battered but whole, and a small boat was rowing toward the rocks. Ada stood on the shore in her father's oilskin, shivering with tiredness and pride. The men who climbed from the boat were wet, bearded, and weeping. One of them was an old captain. He took her hand.`,
`"Miss," he said, "you have saved a hundred and four lives." Ada did not know what to say. "The ship is the Margaret Rose," he added, "and I am Captain Vance. We were carrying families to the new country, and I thought we were lost." He turned to her father and bowed. "Mr Hale, you and your children are the finest keepers on this coast."`,
`The crew stayed three days at Storm Point, mending sails and eating Mother's bread. The passengers came ashore, thin and grateful, and the children played on the rocks with Tom. Ada showed a small girl named Lucy how the lens turned. "It is like a big eye," said Lucy. "It looks after everyone." Ada said that was exactly right.`,
`When the Margaret Rose sailed again, every person aboard stood at the rail and cheered. Captain Vance gave Ada a brass compass engraved with her name. "To remind you," he said, "that you are always a point on someone's map." She kept it all her life. She wrote that night in her diary: "Today I understood what the light is for."`,
`The relief boat finally came in February. The mainland officials had heard the story from the Margaret Rose's owners, and they wrote it in their reports. Father received a letter of thanks signed by three important men. He read it twice, folded it small, and put it in his pocket without a word. Then he went up to wind the lamp.`,
`Years passed. Ada grew up on the headland, and eventually trained as a keeper herself, one of the first women in the service. Tom became a ship's engineer. Their parents grew old in the keeper's cottage, watching the beam turn each night. Ada kept her diary until she was eighty, and every winter she reread the entry for the ninth of January.`,
`Storm Point Light still stands, though machines now tend it. Visitors climb the ninety steps and look at the old brass lamp. In a glass case at the top lies a small, worn diary and a compass with a name on it. The last line Ada wrote reads simply: "We held the light, and the light held us."`
]},
{id:'b4',title:'THE BELL OF ALDENMOOR',genre:'MEDIEVAL',pages:[
`In the year 1311, in the market town of Aldenmoor, the people decided to cast a great bell for their new church. It would be the largest bell in the county. The bellfounder was an old man named Corwin Fell, and his apprentice was a boy of fourteen called Hob, who could carry a bucket of molten tin without spilling a drop.`,
`Hob had come to the forge as an orphan, three years before. Corwin was gruff and kept his own counsel, but he fed the boy well and taught him everything he knew. "A bell is a voice," he liked to say. "Cast it badly and it will shout lies for a hundred years. Cast it well and it will tell the truth to your grandchildren."`,
`The work began in spring. First they dug a deep pit in the churchyard and built the mould from clay, horsehair, and dung, layer upon layer, each one dried slowly by a small fire. Hob learned to mix the clay until it was as smooth as butter. He shaped the inside curve with a wooden template, and Corwin shaped the outside.`,
`At night the boy lay awake and listened to the town. A cart rattling home. A dog barking. The watchman's cry. "What will the bell say?" he wondered. The next day he asked Corwin, who rubbed his chin for some time. "It will say," the old man answered, "what we put into it. So put in something good."`,
`Summer came, and with it a difficulty. The metal had to be bell-bronze, copper and tin in careful measure, and the town had little of either. The lord of the manor, Sir Edmund, sent his steward with a chest of old pots and pans. The women of Aldenmoor brought candlesticks, brooches, and kettles. The pile in the forge grew until it shone.`,
`One evening an old woman named Agnes limped to the forge door, holding something wrapped in cloth. "It was my husband's," she said. "He was a soldier. He never came back." Inside lay a small silver ring. "I would like it to be in the bell," she whispered. "Then I will hear him every Sunday." Hob looked at Corwin. Corwin nodded.`,
`That was how it began. All through the summer people came with small treasures: a child's silver spoon, a bent cross, a lock of hair in a locket, a worn coin from some faraway land. Each one went into the heap. Hob wrote their names in a book, because Corwin said that a bell ought to know who it was made of.`,
`At last came the day of the casting. The whole town gathered in the churchyard before dawn, shivering and hopeful. The furnace roared. Hob and Corwin, with six strong men, tipped the great crucible, and the bronze poured out in a river of orange fire, down the channel and into the pit. Steam hissed. Nobody breathed.`,
`Then they waited. A bell takes days to cool, and no one dares touch it before it is ready. Hob sat by the pit each night, listening to the hot clay tick and settle. Rumours spread through Aldenmoor. Some said the metal had been too cold. Some said an owl had flown over the pit, an ill omen. Corwin ignored them all.`,
`On the fifth day, Hob noticed something odd. A thin crack of dark earth had opened in the churchyard beyond the pit, and from it rose a smell like old stone. He told Corwin, who frowned and dug there himself with a spade. Beneath the soil, a few feet down, lay a flat slab of stone engraved with letters nobody could read.`,
`They fetched the priest, Father Anselm, who knew Latin. He knelt in the earth and read slowly. "It is a grave," he said at last. "A knight, one Sir Walter of Aldenmoor, who died in the Holy Land and was brought home in secret." He added: "He asked that a bell be rung over him. But no bell was ever cast, until now."`,
`Hob felt a chill run through him. He thought of the silver ring, the soldier who never came home, the whole town's small and nameless gifts. "It is as if the bell was waiting for him," he said. Corwin said nothing, but his eyes were bright. "Then it will be rung for him first," he decided. "Before the Mass. Before anything."`,
`On the eighth day the pit was opened. The bell was raised with ropes and pulleys, black and rough and glittering with sand. It was enormous. Hob scrubbed it with a wire brush until the bronze shone like dull gold. Around the rim ran the words he had pressed into the clay: AUDI ALDENMOOR, hear us. And beneath them, in small letters, every name in the book.`,
`Raising it into the tower took two weeks and the strength of every man in town. Hob rode on the beam, tying knots. The belfry was dark and smelled of pigeon. At last the bell hung in its wooden frame, enormous and still, and Corwin put the clapper in with his own two hands. "Now," he said softly. "It is yours, boy. You ring it."`,
`Hob was terrified. He took the rope in both hands. Below, the whole town stood in the churchyard, faces turned up. He thought of Agnes, of the knight, of three years of sweat and clay. He pulled. The great bell swung, and the clapper struck, and a sound rolled out of the tower like a voice from the bottom of the world.`,
`It was not a harsh sound. It was low and sweet and astonishingly clear, with a long gold trembling at the end, like a hand drawn across silk. It rolled across the fields and over the river and into the hills, and the people in the churchyard wept. Agnes pressed her hands to her mouth. "That is him," she whispered. "That is my John."`,
`They buried Sir Walter properly that afternoon, with his sword on his chest and the bell tolling slowly overhead. The priest said the words. A hundred villagers stood bareheaded in the sun. When it was over Corwin walked away alone and sat by the forge, and Hob found him there, staring at the cold ashes with his hands on his knees.`,
`"I am tired, boy," said the old man. "I have made nine bells in my life, and that is the best of them. I never expected to make a better one than I was capable of." He smiled. "I think the town made it. All I did was pour." Hob did not know what to say. He sat beside him, and neither spoke for a long time.`,
`Corwin died that winter, quietly, in his sleep. Hob inherited the forge. He cast many bells in the years that followed, for abbeys and castles and distant cities, and every one carried names in its rim. People said a Fell bell could not lie. The bell of Aldenmoor still rang over the town, rain or shine, every morning at dawn.`,
`When Hob grew old, he climbed the tower one last time and laid his hand on the cool bronze. It hummed faintly under his palm, as if it remembered him. "You told them the truth," he said. "Every day, for sixty years." He listened. Far below, the town was waking, and the bell, which was made of everyone, answered.`
]},
{id:'b5',title:'CAPTAIN VEGA AND THE MOON THIEVES',genre:'SF ADVENTURE',pages:[
`Captain Zara Vega leaned on the rail of the rocket ship Comet and watched the red dust of Mars slide past below. "Three days to Phobos," she said. "Three days, and not one decent cup of coffee in the whole ship." Her mechanic, a round blue robot called Sprocket, whirred sadly. "I can make tea," he offered. "Tea is for emergencies, Sprocket."`,
`The Comet was no great ship, only a patched silver rocket with a crooked fin and a loud engine, but it was Zara's, and it had never once let her down. She had been hired by the Mars Mail Company to carry a mysterious steel box to the moon station on Phobos. "Don't open it," the manager had warned. Naturally, Zara had weighed it with her eyes.`,
`On the second day the radio crackled. "Comet, Comet, this is Station Phobos. Come in, please." The voice sounded stiff and nervous, like a man reading a card. "We are expecting your delivery. Please hold course, and do not, repeat do not, deviate." Zara raised an eyebrow. "They don't normally say please," she murmured. "Sprocket, how's that for suspicious?"`,
`"Very suspicious, Captain," said Sprocket, flashing his chest lights. "Also there is a ship behind us." Zara spun around. Sure enough, a long black rocket was creeping out of an asteroid's shadow, dull as ink, with no markings. It carried no lights at all. "Moon thieves," said Zara softly. "Hold on tight, Sprocket. We are going to run."`,
`She slammed the throttle forward, and the old engine roared like a startled lion. The Comet leapt ahead, rattling every bolt. The black ship fired a bolt of green light that sizzled past the porthole and singed the paint. "Well," said Zara through her teeth, "that is a rude hello." Sprocket began to hum a nervous tune, which only made things worse.`,
`For an hour they dodged through the Belt, ducking round slow grey boulders and sliding between rocks as big as cathedrals. The black ship stayed close behind. Zara flew with her tongue between her teeth, hands flicking over the controls. "They want the box," she said. "I would like to know why." Sprocket pointed a trembling claw. "Captain," he whispered. "The box is ticking."`,
`Zara nearly dropped the wheel. "Ticking?" She dove for the cargo hold, leaving Sprocket to steer, and found the steel box shivering gently on its straps. Something inside was knocking, small and patient, like a visitor at a door. Despite her better judgement, and despite the manager's warning, Zara took a spanner and pried the lid up.`,
`Inside, nestled in straw, sat a pale blue egg the size of a football. It glowed softly. As she watched, a thin crack ran across the shell, and a tiny, furry face peeked out, with enormous silver eyes and a very small, very surprised nose. It squeaked. Zara, who had faced pirates, comets, and her own mother, found herself unable to speak.`,
`"Oh," she said at last. "Oh dear." The creature climbed out of the shell, shook itself, and sat up on her arm, blinking. It looked like a mix between a kitten, a moth, and a small cloud. "A lunar sprite," breathed Sprocket from the cockpit door. "They are said to live on the dark side of the moon. They are worth a fortune."`,
`"That is why they are chasing us," said Zara. She looked at the sprite, and the sprite looked at her, and a strange warm feeling spread through her chest. "Nobody is selling you, little one," she said firmly. The sprite squeaked and nuzzled her thumb. "Sprocket, change of plan. We are not going to Phobos. We are going to take her home."`,
`Home was the dark side of the moon, and nobody had ever landed there. The far side was a place of black craters and silence, where no radio worked and no light shone. But Zara knew a trick. She turned the Comet in a wide arc, and aimed the nose at the cold grey face of the moon, with the black ship screaming in her wake.`,
`They crossed the terminator, the line between day and night, and the world went dark. Stars burned like frost. Zara switched off all the lights. "Run silent," she whispered. The black ship hesitated behind them, its pilot confused by the sudden blackness. Then, to Zara's horror, it fired a flare. The whole sky lit up white and her silhouette stood out like a cut-out.`,
`There was no time to think. She yanked the controls, and the Comet dropped like a stone into the nearest crater. Rock walls flashed past on both sides. Behind them, the black ship plunged in too, and for a moment the two vessels raced neck and neck down the long throat of the crater, sparks flying where their fins scraped the stone.`,
`At the bottom lay a cave mouth, a dark round hole half-hidden in shadow. "There!" cried Sprocket. Zara wrenched the wheel, and the Comet shot through the gap with centimetres to spare. The black ship tried to follow, but it was longer and wider, and it hit the edge with a crunch like a dropped tray. It spun away and tumbled out of sight.`,
`Silence. The Comet drifted slowly into the cave, its engines ticking as they cooled. Zara slumped in her chair, shaking with laughter and relief. In the dark ahead, hundreds of tiny silver lights began to wink on, one by one, like stars coming out. The sprite chirped in her arms. They had arrived at a village of sprites.`,
`The creatures swarmed the ship, a thousand fuzzy faces pressed to every porthole. They were all colours, pale blue, soft pink, silver-white, and every one of them made the same joyful squeak. Zara carried the little one out onto the cave floor, where a large, ancient sprite with wise grey whiskers waited. The baby leapt from her hands into its arms.`,
`The old sprite bowed. It did not speak, but Zara felt its thanks wash over her like warm water. Then the whole crowd sang, a high, soft, wordless song that seemed to come from the rock itself. Sprocket's chest lights flickered and turned gold. "I have never felt so," he said, and then, for once, found no word at all.`,
`They stayed one day in the lunar village. Zara ate glowing fruit that tasted like summer, and Sprocket was polished by a hundred tiny hands until he shone. When it was time to leave, the old sprite pressed a small blue crystal into Zara's palm. It hummed softly. "A thank-you," she guessed. "Or a map. Or maybe a doorbell."`,
`Back on Mars, the Mail Company manager was furious. "Where is my box?" he roared. "Where is my sprite?" Zara looked him in the eye. "Lost in the Belt," she said coolly. "Terrible accident." She did not blink. After a long moment the manager stomped away, muttering, and Sprocket let out a very tiny, very relieved whistle.`,
`That evening Zara sat on the Comet's roof and watched Phobos rise. The blue crystal glowed in her pocket, and for the first time in years she felt content. "Not a bad trip," she said. "Not one decent cup of coffee, though." Sprocket handed her a steaming mug. She sniffed it, and grinned. "Tea," she said. "Emergency tea. How did you know?"`
]}

function booksAvailable(){return Math.min(BOOKS.length,1+systemsDone())}
function wrapText(str,n){const out=[];let line='';for(const w of str.split(' ')){if((line+' '+w).trim().length>n){out.push(line);line=w}else line=(line+' '+w).trim()}if(line)out.push(line);return out}
function bookTurn(d){
  const b=BOOKS[HUB.book||0];if(!b)return;
  let p=(SAVE.bookPage[b.id]||0)+d;p=Math.max(0,Math.min(19,p));SAVE.bookPage[b.id]=p;
  if(p===19&&!SAVE.bookDone[b.id]){SAVE.bookDone[b.id]=1;toast('YOU FINISHED '+b.title);checkUnlocks()}
  save();
}


/* ===== save slots, title menu ===== */
const SLOT_N=6,SHIP_NAMES=['NIGHTFLYER','WREN','STARLING','VESPER','COMET','LANTERN','MERIDIAN','HOBGOBLIN'];
let SLOTMODE='new',SLOTCONF=0,SLOTCONFAT=0,TITLE_INIT=false;
function readSlot(i){try{const j=localStorage.getItem('idlyte_slot_'+i);return j?JSON.parse(j):null}catch(e){return null}}
function slotsUsed(){let n=0;for(let i=1;i<=SLOT_N;i++)if(readSlot(i))n++;return n}
function lastSlot(){let l=+(localStorage.getItem('idlyte_last')||0);if(l>=1&&l<=SLOT_N&&readSlot(l))return l;for(let i=1;i<=SLOT_N;i++)if(readSlot(i))return i;return 0}
function askShipName(def){
  let n=null;try{n=window.prompt('NAME YOUR SHIP',def)}catch(e){}
  if(n==null||!String(n).trim())n=def;
  return String(n).toUpperCase().replace(/[^A-Z0-9 ]/g,'').trim().slice(0,14)||def;
}
function finishLoad(){
  SAVE.crew=Object.assign({nav:0,weap:0,tech:0,eng:0},SAVE.crew||{});
  SAVE.set=Object.assign({vol:1,scan:1,music:1,clock:0,ratio:0,size:0,sharp:0},SAVE.set||{});if(!SAVE.set.crt1){SAVE.set.crt1=1;SAVE.set.scan=1}
  if(!SAVE.arcadeGift){SAVE.arcadeGift=1;SAVE.credits=(SAVE.credits||0)+3}
  for(const c of COMPANIES)if(!SAVE.sh[c.id])SAVE.sh[c.id]={own:0,p:c.price};
  if(SAVE.monthsPaid==null)SAVE.monthsPaid=monthIdx(SAVE.day);
  if(!SAVE.shipName)SAVE.shipName='DRIFTER';
  SAVE.paint=Object.assign({color:'chrome',pattern:'none',accent:'lime',canopy:'cyan'},SAVE.paint||{});SAVE.paint.own=SAVE.paint.own||{};if(SAVE.paint.accent==='orange'&&!SAVE.paint.own['accent:orange'])SAVE.paint.accent='lime';rebuildShip();
  SAVE.extras=SAVE.extras||{};SAVE.booksOwned=SAVE.booksOwned||{};for(const b of BOOKS)if(SAVE.bookOpened[b.id]||SAVE.bookPage[b.id]>0)SAVE.booksOwned[b.id]=1;
  mus.on=SAVE.set.music!==0;muteInit();mus.vol=[.4,.7,1][SAVE.set.vol]||1;applySettings();refreshSpeedBtns();
  HUB.cam.x=0;HUB.cam.y=0;HUB.acc=0;HUB.screen=null;
}
function newGameInSlot(i,name){
  CURSLOT=i;SAVE=Object.assign(freshSave(),{shipName:name});finishLoad();save();musInit();enterHub(true);tellStory('intro','hub');
}
function loadSlot(i){
  const o=readSlot(i);if(!o)return;
  CURSLOT=i;SAVE=Object.assign(freshSave(),o);if(!SAVE.story){SAVE.story={intro:1};if((SAVE.prog[0]||0)>=1)SAVE.story.artifact=1}finishLoad();save();musInit();enterHub(true);checkStory();
}
function continueGame(){const l=lastSlot();if(l)loadSlot(l)}
function slotClick(i){
  const o=readSlot(i);
  if(SLOTMODE==='load'){if(o)loadSlot(i);else toast('THAT SLOT IS EMPTY');return}
  if(o&&!(SLOTCONF===i&&performance.now()-SLOTCONFAT<4000)){SLOTCONF=i;SLOTCONFAT=performance.now();toast('SLOT '+i+' HAS A SAVE. PRESS AGAIN TO REPLACE IT.');return}
  const def=SHIP_NAMES[Math.floor(Math.random()*SHIP_NAMES.length)];
  newGameInSlot(i,askShipName(def));
}
function titleMenu(){
  const has=slotsUsed()>0;
  if(!TITLE_INIT){TITLE_INIT=true;UI.focus=has?0:1}
  const items=[['CONTINUE',has,continueGame],['NEW GAME',true,()=>{SLOTMODE='new';MODE='slots';UI.focus=0}],['LOAD GAME',has,()=>{SLOTMODE='load';MODE='slots';UI.focus=0}],['SETTINGS',true,()=>{MODE='tset';UI.focus=0}]];
  items.forEach((it,k)=>{const y=106+k*17;
    uiBtn(90,y,140,15,()=>{if(it[1])it[2]();else toast('NO SAVED GAMES YET')},(f)=>{
      ctx.fillStyle=!it[1]?'#222222':f?'#6c5eb5':'#352879';ctx.fillRect(90,y,140,15);ctx.fillStyle=!it[1]?'#1a1a1a':f?'#4f43a0':'#2a1f66';ctx.fillRect(91,y+8,138,6);
      ctx.fillStyle=f?'#9a8fe0':'#6c5eb5';ctx.fillRect(90,y,140,1);ctx.fillRect(90,y,1,15);ctx.fillStyle='#1c1840';ctx.fillRect(90,y+14,140,1);ctx.fillRect(229,y,1,15);
      if(f&&it[1]&&Math.floor(titleT*4)%2){text('>',96,y+4,'#ffffff',1);text('<',221,y+4,'#ffffff',1)}
      textC2(it[0],160,y+4,it[1]?'#ffffff':'#666666')})});
  drawToast(176);
}

  for(const s2 of STARS){ctx.fillStyle=s2.c;ctx.fillRect(s2.x|0,s2.y|0,1,1)}
  box(20,8,280,184,'#000','#6c5eb5');ctx.fillStyle='#352879';ctx.fillRect(21,9,278,16);
  textC('SETTINGS',14,'#ffffff',1);

   ['CRT SCREEN',DISP.scan?'ON':'OFF',()=>setDisp('scan',DISP.scan?0:1)],
   ['SOUND',mus.mute?'MUTED':'ON',()=>setMute(!mus.mute)]];
  rows.forEach((r,i)=>{const y=30+i*20;
    uiBtn(26,y,268,18,r[2],(f)=>{ctx.fillStyle=f?'#352879':'#111111';ctx.fillRect(26,y,268,18);if(f){ctx.fillStyle='#70a4b2';ctx.fillRect(26,y,2,18)}
      text(r[0],36,y+6,'#ffffff',1);textR(r[1],286,y+6,'#9ad284',1)})});
  text('AUTOPILOT FLIES FOR YOU. MANUAL: YOU STEER, GUNS STILL FIRE BY THEMSELVES.',28,152,'#70a4b2',1);
  uiBtn(26,166,268,18,()=>{MODE='title';UI.focus=0},(f)=>{ctx.fillStyle=f?'#6c5eb5':'#352879';ctx.fillRect(26,166,268,18);textC2('BACK',160,172,'#ffffff')});
}
function drawSlots(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  for(const s of STARS){ctx.fillStyle=s.c;ctx.fillRect(s.x|0,s.y|0,1,1)}
  box(20,8,280,184,'#000','#6c5eb5');ctx.fillStyle='#352879';ctx.fillRect(21,9,278,16);
  textC(SLOTMODE==='new'?'NEW GAME - CHOOSE A SLOT':'LOAD GAME - CHOOSE A SLOT',14,'#ffffff',1);
  for(let i=1;i<=SLOT_N;i++){
    const y=30+(i-1)*21,o=readSlot(i),conf=SLOTCONF===i&&performance.now()-SLOTCONFAT<4000;
    uiBtn(26,y,268,19,()=>slotClick(i),(f)=>{
      ctx.fillStyle=f?'#352879':'#111111';ctx.fillRect(26,y,268,19);if(f){ctx.fillStyle='#70a4b2';ctx.fillRect(26,y,2,19)}
      text(String(i),32,y+3,'#6c6c6c',1);
      if(o){
        const sys=Object.values(o.prog||{}).filter(v=>v>=3).length;
        text(o.shipName||'DRIFTER',44,y+3,conf?'#ff7777':'#ffffff',1);

  drawToast(150);
}

/* ===== main loop ===== */
let last=performance.now(),acc=0,barShown=null;
function frame(now){
  if(DEV.hold){last=now;requestAnimationFrame(frame);return}
  const dt=Math.min(.1,Math.max(0,(now-last)/1000))||0;last=now;
  UI.list=[];UI.mouseOnly=null;padPoll(dt);
  if(MODE==='title'){if(TOASTS.length){TOASTS[0].t-=dt;if(TOASTS[0].t<=0)TOASTS.shift()}drawTitle(now)}
  else if(MODE==='tset'){drawTSettings()}else if(MODE==='slots'){if(TOASTS.length){TOASTS[0].t-=dt;if(TOASTS[0].t<=0)TOASTS.shift()}drawSlots()}else if(MODE==='game'){
    acc+=dt*SPEED;let n=0;while(acc>=1/60&&n<600){update(1/60);acc-=1/60;n++}
    bankAccrue(dt/6);if(HUB.bankFlash>0)HUB.bankFlash-=dt;
    musVol(0);draw();
  }else if(MODE==='loot'){lootTick(dt);musVol(.2);drawLoot()}
  else if(MODE==='hub'){hubUpdate(dt);drawHub()}
  else if(MODE==='arcade'){arcadeTick(dt);musVol(.1);drawArcade()}
  else if(MODE==='story'){musVol(.25);drawStory(dt)}
  const show=MODE==='game',tshow=isTouch&&(MODE==='hub'||MODE==='arcade'),mshow=MODE==='hub',key=(show?1:0)+(tshow?2:0)+(mshow?4:0);if(key!==barShown){barShown=key;document.getElementById('bar').style.display='none';document.getElementById('touch').style.display=tshow?'flex':'none';document.getElementById('menu').style.display='none';fit()}
  requestAnimationFrame(frame);
}

/* ===== boss viewer: open index.html?bosses. Left/right change boss, Tab (or B/M) swaps boss and mini boss, up/down or 1 to 4 change damage, space shows the hit flash ===== */
if(/[?&]bosses\b/.test(location.search)){setTimeout(()=>{
  let pl=1,mini=false,hf=1,fl=0,b=null,t0=performance.now();
  const has=(p,m)=>{SAVE.planet=p;const A=pk();return !!(A&&(m?true:A.boss))};
  const mkb=()=>{DEV.hold=true;SAVE.planet=pl;MODE='game';newRun(false);G.state='play';G.t=0;G.msgT=0;const A=pk();b=null;if(!A)return;
    if(!mini){if(!A.boss)return;const B=A.boss,hp=90;b={type:'boss',pkBoss:true,x:W+90,y:100,vx:0,vy:0,w:B.w,h:B.h,hp,mhp:hp,pts:5000,t:0,flash:0,shootT:2,ringT:4,phase:0,fr:'boss',in:true};if(B.init)B.init(b)}
    else{const M=A.mini,hp=90,k=MINI_KEY[pl]||'pod';b={type:'mini',fr:k,x:W+30,y:100,vx:-55,vy:0,w:M?M.w:36,h:M?M.h:26,hp,mhp:hp,pts:1500,t:0,flash:0,shootT:1.5,ringT:3.5,in:true,pkMini:!!M};if(M&&M.init)M.init(b);G.mini=b}};
  const loop=now=>{
    const dt=Math.min(.05,(now-t0)/1000);t0=now;G.t+=dt;
    const A=pk();ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;
    drawBackground();
    if(A&&b){b.hp=b.mhp*hf;b.t+=mini?dt:0;
      if(!mini){A.boss.update(b,dt,false);b.hp=b.mhp*hf;A.boss.draw(ctx,b,fl>0)}
      else{miniUpdate(b,dt,false);b.hp=b.mhp*hf;b.flash=fl>0?.1:0;drawMini(b)}}
    if(fl>0)fl-=dt;
    ctx.fillStyle='#000';ctx.fillRect(0,0,W,13);ctx.fillRect(0,BOT+1,W,H-BOT);
    text((mini?'MINI BOSS  ':'BOSS  ')+PLANETS[pl].n,4,4,'#ffffff',1);textR('HEALTH '+Math.round(hf*100)+'%',W-4,4,'#9ad284',1);
    text('LEFT RIGHT: STAGE  TAB: BOSS OR MINI  UP DOWN: DAMAGE  SPACE: FLASH',4,BOT+2,'#bbbbbb',1);
    requestAnimationFrame(loop)};
  const pick=d=>{pl=((pl-1+d+PLANETS.length-1)%(PLANETS.length-1))+1;mkb()},hpOf=k=>[1,.66,.33,.1][k];
  addEventListener('keydown',e=>{const k=e.key;if(k==='ArrowRight')pick(1);else if(k==='ArrowLeft')pick(-1);else if(k==='Tab'||k==='b'||k==='B'||k==='m'||k==='M'){e.preventDefault();mini=!mini;mkb()}else if(k==='ArrowUp'||k==='ArrowDown'){const i=[1,.66,.33,.1].findIndex(v=>Math.abs(v-hf)<.01);hf=hpOf(Math.max(0,Math.min(3,i+(k==='ArrowDown'?1:-1))))}else if(k>='1'&&k<='4')hf=hpOf(+k-1);else if(k===' ')fl=.15});
  cv.addEventListener('pointerdown',e=>{const [x,y]=toCanvas(e);if(y>BOT-6){mini=!mini;mkb()}else pick(x<W/2?-1:1)});
  mkb();requestAnimationFrame(loop)},400)}

/* ===== dev tools for art packs, used from the console: __g.dev.run(2,1) then __g.dev.step(10); __g.dev.show(); __g.dev.sheet(2,0) ===== */
window.__g.dev={
  /* start a mission on planet pl (0 to 5), level lv, with a very tough ship so it can be watched */
  run(pl,lv,god){DEV.hold=false;SAVE.planet=pl;SAVE.level=lv||1;MODE='game';newRun(false);G.state='play';G.msgT=0;if(god!==false){P.hp=9999;G.stats.hp=9999;P.inv=0}last=performance.now();return G},
  /* advance the mission by sec seconds of game time */
  step(sec){for(let i=0;i<sec*60;i++){update(1/60);if(G.state==='play'&&P.hp<50)P.hp=50}},
  /* spawn this planet's boss right now */
  boss(){spawnBoss();return G.boss},
  mini(){spawnMini();return G.mini},
  /* draw one frame and freeze the loop so a screenshot is stable (run() unfreezes) */
  show(){DEV.hold=true;draw()},
  /* zoom overlay for inspecting pixel art: zoom(pl,'cross') shows one enemy type's frames big; zoom(pl,'boss',0.5,true) the boss; zoom() with no arguments removes it */
  zoom(pl,key,arg,arg2){
    const old=document.getElementById('devzoom');if(old)old.remove();if(pl==null)return true;
    DEV.hold=false;SAVE.planet=pl;MODE='game';newRun(false);G.state='play';G.msgT=0;DEV.hold=true;
    const A=pk();if(!A)return false;
    const tmp=mk(320,200),tg=tmp.getContext('2d');let wUsed=0,hUsed=0;
    const fake=(k,x,y,i)=>({type:k==='rock'?'rock':k,fr:k,x,y,t:i*.9,w:16,h:12,hp:3,mhp:3,flash:0,big:i%2===0,spr:i%3,ph:0,y0:y,vx:-30,vy:0,shootT:9});
    if(key==='boss'){
      const B=A.boss;if(!B)return false;const hp=90,b={type:'boss',pkBoss:true,x:W/2,y:100,vx:0,vy:0,w:B.w,h:B.h,hp:hp,mhp:hp,pts:5000,t:0,flash:0,shootT:2,ringT:4,phase:0,fr:'boss',in:true};
      if(B.init)B.init(b);for(let i=0;i<240;i++)B.update(b,1/60,false);b.in=false;b.hp=hp*(arg==null?1:arg);
      const keep=ctx;ctx.save();ctx.fillStyle='#14141c';ctx.fillRect(0,0,W,H);B.draw(ctx,b,!!arg2);tg.drawImage(cv,0,0);ctx.restore();wUsed=320;hUsed=200;
    }else{
      const sk=A.enemies[key];if(!sk)return false;let x=4;
      if(sk.frames){for(const f of sk.frames){tg.drawImage(f,x,4);x+=f.width+4;hUsed=Math.max(hUsed,f.height+8)}if(sk.white){tg.drawImage(sk.white[0],x+4,4);x+=sk.white[0].width+8}wUsed=x}
      else if(sk.draw){tg.save();for(let i=0;i<6;i++){const e=fake(key,28+i*52,30,i);sk.draw(tg,e,i===5)}tg.restore();wUsed=320;hUsed=60}
    }
    const z=Math.max(1,Math.min(12,Math.floor(Math.min(innerWidth-20,1400)/Math.max(40,wUsed))));
    const o=document.createElement('canvas');o.id='devzoom';o.width=wUsed*z;o.height=Math.max(8,hUsed)*z;
    o.style.cssText='position:fixed;left:0;top:0;z-index:99;background:#14141c;image-rendering:pixelated;border:2px solid #70a4b2';
    const og=o.getContext('2d');og.imageSmoothingEnabled=false;og.drawImage(tmp,0,0,wUsed,Math.max(8,hUsed),0,0,o.width,o.height);document.body.appendChild(o);return z;
  },
  /* contact sheets. page 0: every enemy sprite or draw function. page 1: the boss (arg = health 0..1, arg2 = flash). page 2: the scene at time arg (background, midground, foreground) */
  sheet(pl,page,arg,arg2){
    DEV.hold=false;SAVE.planet=pl;MODE='game';newRun(false);G.state='play';G.msgT=0;DEV.hold=true;
    const A=pk();ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.fillStyle='#14141c';ctx.fillRect(0,0,W,H);
    if(!A){text('NO ART PACK FOR PLANET '+pl,8,8,'#ffffff',1);return false}
    const fake=(k,x,y,i)=>({type:k==='rock'?'rock':k,fr:k,x,y,t:i*.9,w:16,h:12,hp:3,mhp:3,flash:0,big:i%2===0,spr:i%3,ph:0,y0:y,vx:-30,vy:0,shootT:9});
    page=page||0;
    if(page===0){
      let y=3;text('PLANET '+pl+' '+PLANETS[pl].n,4,y,'#ffffff',1);y+=9;
      for(const k in (A.enemies||{})){const sk=A.enemies[k];text(k.toUpperCase(),4,y+10,'#9ad284',1);let x=46;
        if(sk.frames){for(const f of sk.frames){ctx.drawImage(f,x,y+((26-f.height)>>1));x+=f.width+3;if(x>236)break}if(sk.white){ctx.drawImage(sk.white[0],270,y+((26-sk.white[0].height)>>1))}}
        else if(sk.draw){for(let i=0;i<5;i++)sk.draw(ctx,fake(k,x+18+i*40,y+13,i),i===4)}
        y+=28}
      return true}
    if(page===1||page===3){
      const B=page===3?A.mini:A.boss;if(!B){text('NO BOSS IN THIS PACK',8,8,'#ffffff',1);return false}
      const hp=90,b={type:page===3?'mini':'boss',pkBoss:page!==3,pkMini:page===3,x:W/2,y:100,vx:0,vy:0,w:B.w,h:B.h,hp:hp,mhp:hp,pts:5000,t:0,flash:0,shootT:2,ringT:4,phase:0,fr:'boss',in:true};
      if(B.init)B.init(b);
      for(let i=0;i<240;i++){b.t+=1/60;B.update(b,1/60,false)}   /* let the entrance and settle finish; no attacks (live=false) */
      b.in=false;b.hp=hp*(arg==null?1:arg);
      ctx.fillStyle='#000';ctx.fillRect(0,TOP,W,BOT-TOP);
      B.draw(ctx,b,!!arg2);text('BOSS  W '+B.w+' H '+B.h+'  HP '+Math.round((arg==null?1:arg)*100)+'%',4,BOT+2,'#ffffff',1);
      return true}
    if(page===2){
      G.t=arg||0;drawBackground();
      for(const k in (A.enemies||{})){const sk=A.enemies[k];if(k==='rock'||!sk)continue}
      if(A.drawMidground)A.drawMidground(G.t+G.loop*LEVEL_LEN);
      if(A.drawForeground)A.drawForeground(G.t+G.loop*LEVEL_LEN);
      return true}
    return false;
  }
};
