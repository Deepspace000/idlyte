<script>
'use strict';
/* ===== setup ===== */
const W=320,H=200,TOP=14,BOT=192;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
cv.width=W;cv.height=H;
function fit(){
  const bar=document.getElementById('bar'),tb=document.getElementById('touch'),mn=document.getElementById('menu'),bh=(mn&&mn.offsetHeight?mn.offsetHeight+8:0)+(bar&&bar.offsetHeight?bar.offsetHeight:0)+(tb&&tb.offsetHeight?tb.offsetHeight:0)+30;
  let s=Math.min((innerWidth-8)/W,(innerHeight-bh)/H);
  s=s>=2?Math.floor(s):Math.max(.5,s);
  cv.style.width=W*s+'px';cv.style.height=H*s+'px';
}
addEventListener('resize',fit);fit();

const PAL={k:'#000000',w:'#ffffff',d:'#444444',g:'#6c6c6c',l:'#959595',L:'#bbbbbb',
 b:'#352879',B:'#6c5eb5',c:'#70a4b2',r:'#68372b',o:'#9a6759',y:'#b8c76f',n:'#6f4f25',
 G:'#588d43',p:'#6f3d86',R:'#883232'};
const BORDER_DEF='#6c5eb5';

/* ===== tiny font (3x5) ===== */
const FONT={A:'25755',B:'65656',C:'34443',D:'65556',E:'74647',F:'74644',G:'34553',H:'55755',I:'72227',J:'11152',K:'55655',L:'44447',M:'57755',N:'75555',O:'25552',P:'65644',Q:'25531',R:'65655',S:'34216',T:'72222',U:'55557',V:'55552',W:'55577',X:'55255',Y:'55222',Z:'71247',
 0:'75557',1:'26227',2:'61247',3:'61216',4:'55711',5:'74616',6:'34652',7:'71244',8:'25252',9:'25316','-':'00700',':':'02020','.':'00002','+':'02720','!':'22202',' ':'00000','/':'11244','%':'51245'};
function text(s,x,y,col,sc){
  sc=sc||1;ctx.fillStyle=col;s=String(s).toUpperCase();
  for(let i=0;i<s.length;i++){
    const g=FONT[s[i]]||FONT[' '];
    for(let r=0;r<5;r++){const v=+g[r];
      for(let c=0;c<3;c++) if(v&(4>>c)) ctx.fillRect(x+(i*4+c)*sc,y+r*sc,sc,sc);}
  }
}
function textW(s,sc){return String(s).length*4*(sc||1)-(sc||1)}
function textC(s,y,col,sc){text(s,((W-textW(s,sc))/2)|0,y,col,sc)}

/* ===== sprite helpers ===== */
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function fromRows(rows,mapFn){
  const h=rows.length,w=Math.max(...rows.map(r=>r.length));
  const c=mk(w,h),x=c.getContext('2d');
  for(let j=0;j<h;j++)for(let i=0;i<rows[j].length;i++){
    const ch=rows[j][i];if(ch==='.')continue;
    const col=mapFn?mapFn(ch,i,j):PAL[ch];if(col){x.fillStyle=col;x.fillRect(i,j,1,1)}
  }
  return c;
}
function whiteOf(c){
  const o=mk(c.width,c.height),x=o.getContext('2d');x.drawImage(c,0,0);
  x.globalCompositeOperation='source-in';x.fillStyle='#fff';x.fillRect(0,0,o.width,o.height);return o;
}
/* chrome shading: mask(x,y)->bool over w*h; vertical bands per column, like the Thalamus chrome look */
const CHROME={
  blue:[[0,'#6c6c6c'],[.07,'#959595'],[.18,'#ffffff'],[.3,'#bbbbbb'],[.42,'#6c6c6c'],[.5,'#000000'],[.56,'#352879'],[.66,'#6c5eb5'],[.74,'#70a4b2'],[.82,'#6c5eb5'],[.92,'#352879'],[.98,'#444444']],
  green:[[0,'#6c6c6c'],[.07,'#959595'],[.18,'#ffffff'],[.3,'#bbbbbb'],[.42,'#6c6c6c'],[.5,'#000000'],[.56,'#2c5a2c'],[.66,'#588d43'],[.74,'#9ad284'],[.82,'#588d43'],[.92,'#2c5a2c'],[.98,'#444444']],
  red:[[0,'#6c6c6c'],[.07,'#959595'],[.18,'#ffffff'],[.3,'#bbbbbb'],[.42,'#6c6c6c'],[.5,'#000000'],[.56,'#68372b'],[.66,'#9a6759'],[.74,'#ff7777'],[.82,'#9a6759'],[.92,'#68372b'],[.98,'#444444']],
  steel:[[0,'#6c6c6c'],[.07,'#959595'],[.18,'#ffffff'],[.3,'#bbbbbb'],[.42,'#6c6c6c'],[.5,'#000000'],[.56,'#444444'],[.66,'#6c6c6c'],[.74,'#bbbbbb'],[.82,'#6c6c6c'],[.92,'#444444'],[.98,'#222222']]
};
function bandCol(bands,f){let c=bands[0][1];for(const b of bands){if(f>=b[0])c=b[1];else break}return c}
function shaded(w,h,mask,bands,extra){
  const c=mk(w,h),x=c.getContext('2d');
  const m=[];for(let j=0;j<h;j++){m[j]=[];for(let i=0;i<w;i++)m[j][i]=!!mask(i,j)}
  for(let i=0;i<w;i++){
    let t=-1,b=-1;for(let j=0;j<h;j++)if(m[j][i]){if(t<0)t=j;b=j}
    if(t<0)continue;
    for(let j=t;j<=b;j++){
      if(!m[j][i])continue;
      const edge=!(m[j-1]&&m[j-1][i])||!(m[j+1]&&m[j+1][i])||!m[j][i-1]||!m[j][i+1];
      const f=b===t?.2:(j-t)/(b-t);
      let col=bandCol(bands,f);
      if(edge&&(j===t||j===b))col='#333333';
      if(extra){const e=extra(i,j,col,f);if(e)col=e}
      x.fillStyle=col;x.fillRect(i,j,1,1);
    }
  }
  return c;
}

/* ===== player ship (hand drawn, chrome, nose to the right) ===== */
const HALF=[
"........kkkkkkkkkkkkkkk.",
"........kLwwwwwwwwwwwlgk",
"........kdgggggggggggkk.",
"....kkkkkdgLwlgk........",
"..kkddgLwwwlllgkk.......",
".kddgLwwwwwlllllgkk.....",
"kddgLwwwwwwlkBBcgkk.....",
"krdgLLwwwwwwkBBcwwlkk...",
"kordgggLLwwwwwwwwwwwk..."
];
const PAINTS=[{},{B:'#9a6759',c:'#ff7777',b:'#68372b'},{B:'#588d43',c:'#9ad284',b:'#2c5a2c'},{B:'#b8c76f',c:'#ffffff',b:'#9a6759'}];
function buildShipSet(paint){
  const P2=Object.assign({},PAL,paint);
  const half=HALF.map(r=>r.padEnd(24,'.').slice(0,24));
  const rows=[...half,...half.slice(0,8).reverse()];
  const dark={w:'l',l:'g',g:'d',B:'g',c:'l',b:'d'};
  const base=fromRows(rows,(ch,i,j)=>{
    if(j>8){const m=dark[ch];return P2[m||ch]}
    return P2[ch];
  });
  const x=base.getContext('2d');
  x.fillStyle='#9a6759';x.fillRect(0,7,2,1);x.fillRect(0,9,2,1);
  x.fillStyle='#ffffff';x.fillRect(10,8,2,1);
  x.fillStyle='#70a4b2';x.fillRect(7,1,1,1);x.fillRect(7,15,1,1);
  const w=base.width,h=base.height,src=x.getImageData(0,0,w,h),N=16,out=[];
  for(let f=0;f<N;f++){
    const c=Math.cos(f/N*Math.PI*2),ac=Math.max(.14,Math.abs(c));
    const o=mk(w,h),ox=o.getContext('2d'),od=ox.createImageData(w,h);
    for(let j=0;j<h;j++){
      const dy=j-8;let sj=Math.round(8+(c<0?-dy:dy)/ac);
      if(ac<.3&&Math.abs(dy)<=2)sj=8;
      if(sj<0||sj>=h)continue;
      for(let i=0;i<w;i++){const k=(sj*w+i)*4,q=(j*w+i)*4;
        od.data[q]=src.data[k];od.data[q+1]=src.data[k+1];od.data[q+2]=src.data[k+2];od.data[q+3]=src.data[k+3]}
    }
    ox.putImageData(od,0,0);out.push(o);
  }
  return out;
}
const SPR={};
SPR.shipSets=PAINTS.map(buildShipSet);
SPR.shipRoll=SPR.shipSets[0];

/* ===== enemies (procedural chrome, rolling frames) ===== */
function ringFrames(bands,ro,ri){
  const size=ro*2+3,cs=[1,.8,.5,.22,.5,.8],fr=[];
  for(const cs_ of cs){
    fr.push(shaded(size,size,(x,y)=>{
      const dx=x-(size-1)/2,dy=(y-(size-1)/2)/cs_;
      const d=Math.hypot(dx,dy);return d<=ro&&d>=ri-(1-cs_)*1.2;
    },bands));
  }
  return fr;
}
function dartFrames(bands){
  const L=15,fr=[];
  for(const cs_ of [1,.7,.4,.7]){
    fr.push(shaded(L,9,(x,y)=>{
      const dy=(y-4)/cs_,t=x/(L-1); // x=0 is the nose (flies left)
      const hw=0.6+t*3.4;           // wider toward the tail
      const wing=(t>.55&&Math.abs(dy)<4.2&&Math.abs(dy)>hw-.5);
      return Math.abs(dy)<=hw||(wing&&t<.95);
    },bands));
  }
  return fr;
}
function crossFrames(bands){
  const S=15,fr=[];
  for(let a=0;a<4;a++){
    const ang=a*Math.PI/8;
    fr.push(shaded(S,S,(x,y)=>{
      const dx=x-7,dy=y-7,u=dx*Math.cos(ang)+dy*Math.sin(ang),v=-dx*Math.sin(ang)+dy*Math.cos(ang);
      const arm=(Math.abs(u)<=7&&Math.abs(v)<=2.4)||(Math.abs(v)<=7&&Math.abs(u)<=2.4);
      return arm||Math.hypot(dx,dy)<=2.8;
    },bands));
  }
  return fr;
}
function podFrames(){
  const S=17,fr=[];
  for(let a=0;a<4;a++){
    fr.push(shaded(S,13,(x,y)=>{
      const dx=(x-8)/8.2,dy=(y-6)/6.2;return dx*dx+dy*dy<=1;
    },CHROME.green,(i,j,col,f)=>{
      const r=a%2?2:3;
      if(Math.hypot(i-8,j-6)<r)return a%2?'#ffffff':'#b8c76f';
    }));
  }
  return fr;
}
function rockSprite(r,seed){
  const S=r*2+3;let s=seed;
  const rnd=()=>(s=(s*1103515245+12345)&0x7fffffff)/0x7fffffff;
  const n=9,rad=[];for(let i=0;i<n;i++)rad.push(r*(0.72+rnd()*0.42));
  const c=mk(S,S),x=c.getContext('2d');
  const cols=['#2a2a2a','#444444','#6c6c6c','#959595'];
  for(let j=0;j<S;j++)for(let i=0;i<S;i++){
    const dx=i-(S-1)/2,dy=j-(S-1)/2,a=(Math.atan2(dy,dx)+Math.PI)/(Math.PI*2)*n,k=Math.floor(a)%n,f=a-Math.floor(a);
    const rr=rad[k]*(1-f)+rad[(k+1)%n]*f;
    if(Math.hypot(dx,dy)<=rr){
      let l=(-dx-dy)/(r*1.4)+0.5+(rnd()-.5)*.35;
      if(Math.hypot(dx,dy)>rr-1.2)l-=.35;
      x.fillStyle=cols[Math.max(0,Math.min(3,Math.floor(l*3.2)))];x.fillRect(i,j,1,1);
    }
  }
  return c;
}
SPR.ring=ringFrames(CHROME.blue,6,3);
SPR.ringR=ringFrames(CHROME.red,6,3);
SPR.dart=dartFrames(CHROME.steel);
SPR.cross=crossFrames(CHROME.red);
SPR.pod=podFrames();
SPR.rockL=[rockSprite(9,3),rockSprite(10,11)];
SPR.rockS=[rockSprite(4,5),rockSprite(5,9),rockSprite(4,17)];
for(const k of ['ring','ringR','dart','cross','pod'])SPR[k+'W']=SPR[k].map(whiteOf);

/* boss: chrome horned manta */
(function(){
  const w=70,h=48,cx=44,cy=24;
  const horn=(x,y,sg)=>{ // sweeping horn toward the left
    for(let s=0;s<=1;s+=.01){
      const hx=50-s*46,hy=cy+sg*(11+Math.pow(s,1.4)*11),th=(1-s)*3.4+.8;
      if(Math.hypot(x-hx,y-hy)<th)return true;
    }
    return false;
  };
  const mask=(x,y)=>{
    const dx=(x-cx)/25,dy=(y-cy)/10.5;
    if(dx*dx+dy*dy<=1)return true;
    if(x>52&&Math.abs(y-cy)<=Math.max(1,12-(x-52)*.55)&&x<68)return true; // tail fin
    if(horn(x,y,1)||horn(x,y,-1))return true;
    return false;
  };
  const extra=(i,j,col,f)=>{
    const ex=22,ey=cy; // glowing eye, left
    const d=Math.hypot((i-ex)/4,(j-ey)/3);
    if(d<.45)return '#ffffff';
    if(d<1)return '#ff7777';
    if(d<1.25)return '#68372b';
    // seams
    if((i===34||i===46)&&Math.abs(j-cy)<8)return '#000';
    return null;
  };
  SPR.boss=shaded(w,h,mask,CHROME.blue,extra);
  SPR.bossW=whiteOf(SPR.boss);
})();

/* misc sprites */
SPR.coin=[0,1,2,3].map(a=>{
  const w=[5,4,2,4][a],c=mk(6,6),x=c.getContext('2d'),ox=(6-w)/2;
  x.fillStyle='#b8c76f';x.fillRect(ox,0,w,6);x.fillStyle='#9a6759';x.fillRect(ox,5,w,1);
  x.fillStyle='#ffffff';x.fillRect(ox,0,1,2);
  x.fillStyle='#444';if(w>3)x.fillRect(ox+2,2,1,2);return c;
});
function capsule(col,letter){
  const c=mk(11,9),x=c.getContext('2d');
  x.fillStyle='#000';x.fillRect(1,0,9,9);x.fillRect(0,1,11,7);
  x.fillStyle=col;x.fillRect(1,1,9,7);x.fillStyle='#fff';x.fillRect(2,1,7,1);
  x.fillStyle='#000';x.fillRect(3,2,5,5);
  const g=FONT[letter];x.fillStyle='#fff';
  for(let r=0;r<5;r++)for(let q=0;q<3;q++)if(+g[r]&(4>>q))x.fillRect(4+q,2+r,1,1);
  return c;
}
SPR.pw={P:capsule('#ff7777','P'),S:capsule('#70a4b2','S'),M:capsule('#b8c76f','M'),H:capsule('#9ad284','+')};

/* ===== backgrounds ===== */
const BAYER=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
function dithered(w,h,fn,cols){ // fn(x,y)->0..1 ; cols ascending
  const c=mk(w,h),x=c.getContext('2d');
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){
    const v=fn(i,j);if(v<0)continue;
    const t=v*(cols.length-1),k=Math.min(cols.length-2,Math.floor(t)),f=t-k;
    x.fillStyle=f>BAYER[j&3][i&3]/16?cols[k+1]:cols[k];x.fillRect(i,j,1,1);
  }
  return c;
}
SPR.planet=(function(){
  const R=44,S=R*2+1;
  return dithered(S,S,(x,y)=>{
    const dx=x-R,dy=y-R,d=Math.hypot(dx,dy);if(d>R)return -1;
    const nx=dx/R,ny=dy/R,nz=Math.sqrt(Math.max(0,1-nx*nx-ny*ny));
    const lit=Math.max(0,(-nx*.75-ny*.35+nz*.55));
    const band=.5+.5*Math.sin(ny*9+Math.sin(nx*3)*.8);
    return Math.min(1,lit*.55+band*.45*lit+(d>R-1.5?-.3:0))*0.999;
  },['#000000','#352879','#6f3d86','#9a6759','#b8c76f']);
})();
SPR.cloud=function(seed){
  let s=seed;const rnd=()=>(s=(s*1103515245+12345)&0x7fffffff)/0x7fffffff;
  const w=150,h=50,blobs=[];for(let i=0;i<9;i++)blobs.push([rnd()*w,rnd()*h,10+rnd()*18]);
  return dithered(w,h,(x,y)=>{
    let v=0;for(const b of blobs){const d=Math.hypot((x-b[0])/1.8,y-b[1]);v=Math.max(v,1-d/b[2])}
    return v<=0.05?-1:Math.min(1,v)*0.8;
  },['#000000','#352879','#6f3d86']);
};
const CLOUDS=[SPR.cloud(7),SPR.cloud(41),SPR.cloud(99)];
const STARS=[];
for(let l=0;l<3;l++)for(let i=0;i<(l?34:50);i++)
  STARS.push({x:Math.random()*W,y:TOP+Math.random()*(BOT-TOP),l,c:['#444444','#6c6c6c','#bbbbbb','#70a4b2','#ffffff'][l===0?(i%2):l===1?2+(i%2):4]});
const STAR_V=[6,16,38];

/* ===== save / stats ===== */
let SAVE={coins:0,best:0,runs:0,kills:0,up:{},inv:{},bank:0,bankMax:0,day:0,monthsPaid:null,ships:[0],ship:0,missions:[0],mission:0,sorties:0,clears:0,earned:0,sold:0,sh:{},ach:{},opened:{},crew:{nav:0,weap:0,tech:0,eng:0},fitXP:0,fed:0,set:{vol:1,scan:0,music:1},planet:0,pSeen:{},visited:0,level:1,prog:{},tapHull:0,tapXP:0,taps:0,credits:0,arcadeHi:0,bestPct:{},fitLv:0,fitPts:0};

/* ===== catalogue: ships, missions, salvage, upgrades ===== */
const SHIPS=[
 {n:'DRIFTER',price:0,hp:0,sp:1,fr:1,dm:1,opt:0,d:'THE STANDARD SHIP'},

 {id:'scrap',n:'SCRAP METAL',v:4,w:50,c:'#6c6c6c'},

 {id:'plate',n:'CHROME PLATE',v:22,w:14,c:'#bbbbbb'},

/* ===== autopilot ===== */
function aiThink(){
  const st=G.stats,a=G.ai;
  let best=1e9,bx=P.x,by=P.y;
  const xmin=14,xmax=132;
  for(let gx=xmin;gx<=xmax;gx+=10)for(let gy=TOP+8;gy<=BOT-8;gy+=6){
    let c=Math.abs(gx-P.x)*.045+Math.abs(gy-P.y)*.035+(gx-40)*.02;
    // enemy bullets: predict closest approach
    for(const b of EB){
      const rx=gx-b.x,ry=gy-b.y,v2=b.vx*b.vx+b.vy*b.vy;
      let tc=v2?(rx*b.vx+ry*b.vy)/v2:0;if(tc<0||tc>2.5)continue;
      const d=Math.hypot(rx-b.vx*tc,ry-b.vy*tc);
      if(d<15)c+=(15-d)*(3.2-tc);
    }
    for(const e of E){
      const hw=e.w/2+8,hh=e.h/2+7;
      // where the enemy will be by the time we get there
      const t=Math.min(1.2,Math.hypot(gx-P.x,gy-P.y)/st.speed);
      const ex=e.x+e.vx*t,ey=e.y+(e.vy||0)*t;
      const dx=Math.abs(gx-ex),dy=Math.abs(gy-ey);
      if(dx<hw+10&&dy<hh+8)c+=(hw+10-dx)*.6+(hh+8-dy)*.8+20;
      // shooting position: be level with enemies ahead
      if(e.x>gx&&e.x<W+6){const al=Math.abs(gy-e.y);if(al<e.h/2+2)c-=5-(e.x-gx)*.012;}
    }
    for(const k of PK){
      const d=Math.hypot(gx-k.x,gy-k.y);
      if(k.k==='coin'){if(d<45)c-=(45-d)*.08}else{if(d<90)c-=(90-d)*.2}
    }
    // keep off the borders a little
    if(gy<TOP+14)c+=(TOP+14-gy)*.1;if(gy>BOT-14)c+=(gy-BOT+14)*.1;
    c+=Math.random()*(1-st.skill)*14; // imperfect pilot
    if(c<best){best=c;bx=gx;by=gy}
  }
  a.tx=bx;a.ty=by;
}

  P.hp--;P.inv=G.stats.damper;shake=.3;BORDER='#883232';borderT=.12;boom(P.x,P.y,14,false);

  if(G.state==='play'||G.state==='clear'){const pc=runPct(),bk=G.planet+'-'+G.level;if(pc>(SAVE.bestPct[bk]||0))SAVE.bestPct[bk]=pc}
  G.salv=G.salv.filter(q=>(q.t-=dt)>0);if(G.flashT>0)G.flashT-=dt;
  // stars scroll in all states
  const sv=G.state==='clear'?4:1;
  for(const s of STARS){s.x-=STAR_V[s.l]*sv*dt*(G.state==='clear'?(1+G.warp*0):1);if(s.x<0){s.x+=W;s.y=TOP+Math.random()*(BOT-TOP)}}

  if(G.state==='dead'){G.timer-=dt;if(G.timer<=0){endSortie('lost');return}
    updateEntities(dt,false);return}
  if(G.state==='clear'){G.timer-=dt;P.x+=(G.timer<3?120:0)*dt;P.inv=9;
    if(G.timer<3)G.warp=1;
    if(G.timer<=0){endSortie('clear');return}
    updateEntities(dt,false);return}

  // level clock + script
  if(!G.boss){
    G.t+=dt;
    while(G.si<G.script.length&&G.script[G.si].t<=G.t)spawn(G.script[G.si++]);
    if(G.t>=LEVEL_LEN-3&&!G.warned){G.warned=1;G.msg='WARNING';G.msgT=3}
    if(G.t>=LEVEL_LEN&&!G.boss&&E.filter(e=>e.type!=='rock').length<2)spawnBoss();
  }

  G.ai.next-=dt;if(G.ai.next<=0){aiThink();G.ai.next=.09}
  const st=G.stats,dx=G.ai.tx-P.x,dy=G.ai.ty-P.y,dl=Math.hypot(dx,dy);
  if(dl>1){const m=Math.min(dl,st.speed*dt*(dl>6?1:dl/6+.2));P.x+=dx/dl*m;P.y+=dy/dl*m}
  P.x=Math.max(14,Math.min(140,P.x));P.y=Math.max(TOP+8,Math.min(BOT-8,P.y));
  P.anim+=dt;P.trail.push(P.x,P.y);if(P.trail.length>160)P.trail.splice(0,2);
  if(G.stats.repair){P.rep=(P.rep||0)+dt;if(P.rep>=25){P.rep=0;if(P.hp<G.stats.hp){P.hp++;G.msg='REPAIRED';G.msgT=1}}}if(P.inv>0)P.inv-=dt;
  if(P.wpnT>0){P.wpnT-=dt;if(P.wpnT<=0&&P.wpn>G.stats.startGun){P.wpn--;P.wpnT=P.wpn>G.stats.startGun?12:0}}
  if(P.shield>0)P.shield-=dt;if(P.mag>0)P.mag-=dt;
  P.fireT-=dt;if(P.fireT<=0&&E.length)fireShots();
  if(G.stats.missile){P.misT=(P.misT||0)-dt;if(P.misT<=0&&E.length){P.misT=1.8/(1+G.stats.missile*.5);PB.push({x:P.x+8,y:P.y,vx:110,vy:(Math.random()<.5?-1:1)*40,dmg:3,hm:1})}}
  updateEntities(dt,true);
}
function updateEntities(dt,live){
  // player shots
  for(const b of PB){
    if(b.hm){let tg=null,bd=1e9;for(const e of E){if(e.x<b.x-8)continue;const d=Math.hypot(e.x-b.x,e.y-b.y);if(d<bd){bd=d;tg=e}}
      if(tg){const want=Math.max(-130,Math.min(130,(tg.y-b.y)*4));b.vy+=(want-b.vy)*Math.min(1,dt*6)}b.vx=Math.min(210,b.vx+220*dt)}
    b.x+=b.vx*dt;b.y+=b.vy*dt}
  PB=PB.filter(b=>b.x<W+10&&b.y>TOP-4&&b.y<BOT+4);
  // enemies
  for(const e of E){
    e.t+=dt;if(e.flash>0)e.flash-=dt;
    if(e.type==='ring'||e.type==='ringR'){e.x+=e.vx*dt;e.y=e.y0+Math.sin(e.t*3.2+e.ph)*30;
      if(live&&e.x<W-30&&e.x>60&&(e.shootT-=dt)<=0){e.shootT=rnd(2.2,4);enemyShot(e,0)}}
    else if(e.type==='dart'){
      e.x+=e.vx*dt;if(e.t<.9&&live)e.y+=Math.sign(P.y-e.y)*Math.min(Math.abs(P.y-e.y),30*dt)}
    else if(e.type==='cross'){e.x+=e.vx*dt;e.y+=e.vy*dt;if(e.y<TOP+10||e.y>BOT-10)e.vy*=-1;
      if(live&&e.x<W-20&&e.x>80&&(e.shootT-=dt)<=0){e.shootT=rnd(1.8,3);enemyShot(e,0)}}
    else if(e.type==='pod'){e.x+=e.vx*dt;e.y+=Math.sin(e.t*1.5)*10*dt;
      if(live&&e.x<W-20&&e.x>80&&(e.shootT-=dt)<=0){e.shootT=rnd(2.2,3.2);enemyShot(e,0);enemyShot(e,.35);enemyShot(e,-.35)}}
    else if(e.type==='rock'){e.x+=e.vx*dt;e.y+=e.vy*dt}
    else if(e.type==='boss'){bossUpdate(e,dt,live)}
  }
  // enemy bullets
  for(const b of EB){b.x+=b.vx*dt;b.y+=b.vy*dt;b.t+=dt}
  EB=EB.filter(b=>b.x>-6&&b.x<W+6&&b.y>TOP-6&&b.y<BOT+6);
  // collisions: shots vs enemies
  for(const e of E){
    if(e.dead)continue;
    for(const b of PB){
      if(b.dead)continue;
      if(Math.abs(b.x-e.x)<e.w/2+3&&Math.abs(b.y-e.y)<e.h/2+1){
        b.dead=1;e.hp-=b.dmg;e.flash=.07;FX.push({x:b.x+3,y:b.y,vx:rnd(-20,20),vy:rnd(-20,20),life:.15,c:'#ffffff',s:1});
        if(e.hp<=0){e.dead=1;killEnemy(e);break}
      }
    }
  }
  PB=PB.filter(b=>!b.dead);
  E=E.filter(e=>!e.dead&&e.x>-40&&e.y>-30&&e.y<H+30);
  if(live&&G.state==='play'){
    for(const e of E){
      if(Math.abs(e.x-P.x)<e.w/2+7&&Math.abs(e.y-P.y)<e.h/2+3){
        if(e.type!=='boss'&&P.inv<=0){e.hp-=3;e.flash=.1;if(e.hp<=0){e.dead=1;killEnemy(e)}}
        hurtPlayer();
      }
    }
    for(const b of EB){if(Math.abs(b.x-P.x)<6&&Math.abs(b.y-P.y)<4){b.dead=1;hurtPlayer()}}
    EB=EB.filter(b=>!b.dead);E=E.filter(e=>!e.dead);
  }
  // pickups
  const mr=P.mag>0?95:G.stats.magnet;
  for(const k of PK){
    k.t+=dt;
    const dx=P.x-k.x,dy=P.y-k.y,d=Math.hypot(dx,dy);
    if(live&&d<mr&&d>0){const pull=(k.k==='coin'?160:90)*(1-d/(mr+10))+40;k.x+=dx/d*pull*dt;k.y+=dy/d*pull*dt}
    else{k.x+=k.vx*dt;k.y+=k.vy*dt;k.vx+=(-26-k.vx)*dt*1.5;k.vy*=1-dt*2}
    if(live&&d<12){
      k.dead=1;
      if(k.k==='coin'){const cm=G.stats.coinMul,v=Math.max(1,Math.floor(cm)+(Math.random()<cm%1?1:0));SAVE.coins+=v;SAVE.earned+=v;G.coinsRun+=v;G.score+=10}
      else if(k.k==='item'){const it=ITEMS.find(q=>q.id===k.id);G.loot[k.id]=(G.loot[k.id]||0)+1;G.score+=25;G.salv.unshift({t:1.8,name:it.n,c:it.c,v:it.v,ix:ITEMS.indexOf(it)});if(G.salv.length>3)G.salv.pop();if(it.v>=90)G.flashT=.3}
      else powerup(k.p);
    }
  }
  PK=PK.filter(k=>!k.dead&&k.x>-10);
  // fx
  for(const f of FX){f.life-=dt;if(f.ring){f.r+=(f.max/.35)*dt}else{f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=1-dt*2;f.vy*=1-dt*2}}
  FX=FX.filter(f=>f.life>0);
}
function enemyShot(e,ang){
  let a=Math.atan2(P.y-e.y,P.x-e.x)+ang+rnd(-.12,.12);
  const sp=62+G.loop*6;
  EB.push({x:e.x-6,y:e.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,t:0});
}
function bossUpdate(b,dt,live){
  b.t+=dt;
  if(b.in){b.x+=b.vx*dt;if(b.x<=252){b.in=false;b.vx=0}return}
  b.y=100+Math.sin(b.t*.8)*(55+(b.hp<b.mhp/2?15:0));
  b.x=252+Math.sin(b.t*.5)*10;
  if(!live)return;
  b.shootT-=dt;b.ringT-=dt;
  if(b.shootT<=0){b.shootT=b.hp<b.mhp/2?1.1:1.7;for(let i=-1;i<=1;i++)enemyShot({x:b.x-14,y:b.y},i*.28)}
  if(b.ringT<=0){b.ringT=3.6;for(let i=0;i<9;i++){const a=Math.PI+(i-4)*.36;EB.push({x:b.x-20,y:b.y,vx:Math.cos(a)*50,vy:Math.sin(a)*50,t:0})}}
  if(b.hp<b.mhp*.6&&!b.sum||b.hp<b.mhp*.3&&b.sum===1){b.sum=(b.sum||0)+1;for(let i=0;i<4;i++)spawn({type:'dart',y:rnd(TOP+12,BOT-12),rand:1}).x=W+10+i*16}
}

function runPct(){
  if(G.state==='clear')return 100;
  if(G.boss)return 90+10*(1-Math.max(0,G.boss.hp/G.boss.mhp));
  return Math.min(90,G.t/LEVEL_LEN*90);
}
function levelSegs(planet,curLevel,runPc){
  const out=[];
  for(let lv=1;lv<=3;lv++){const cleared=(SAVE.prog[planet]||0)>=lv,best=cleared?100:Math.floor(SAVE.bestPct[planet+'-'+lv]||0);
    out.push({lv,best,locked:lv>maxLevel(planet),cur:lv===curLevel,run:lv===curLevel?runPc:0})}
  return out;
}
function drawLevelMap(x,y,w,h,segs,withText){
  const gap=3,sw=Math.floor((w-gap*2)/3);
  segs.forEach((q,i)=>{
    const sx=x+i*(sw+gap);
    ctx.fillStyle=q.cur?'#ffffff':'#444444';ctx.fillRect(sx-1,y-1,sw+2,h+2);ctx.fillStyle=q.locked?'#222222':'#000000';ctx.fillRect(sx,y,sw,h);
    if(!q.locked){
      ctx.fillStyle=q.best>=100?'#588d43':'#6c5eb5';ctx.fillRect(sx,y,Math.round(sw*q.best/100),h);
      if(q.cur&&q.run>q.best){ctx.fillStyle='#9ad284';ctx.fillRect(sx,y,Math.round(sw*q.run/100),h)}
      if(q.cur){ctx.fillStyle='#ffffff';ctx.fillRect(Math.min(sx+sw-1,sx+Math.round(sw*q.run/100)),y,1,h)}
    }
    if(withText){
      const t=q.locked?'L'+q.lv+' LOCKED':(q.cur?'L'+q.lv+' '+Math.floor(q.run)+'% BEST '+Math.floor(Math.max(q.best,q.run))+'%':'L'+q.lv+' BEST '+q.best+'%');
      text(t,sx+2,y+((h-5)>>1),q.locked?'#6c6c6c':'#ffffff',1);
    }
  });
}

}
function fitNeed(){return Math.round(300*Math.pow(1.45,SAVE.fitLv||0))}
function fitMul(){return 1+.02*(SAVE.fitLv||0)}
function addFit(p){
  if((SAVE.fitLv||0)>=10)return;
  SAVE.fitPts=(SAVE.fitPts||0)+p;
  while(SAVE.fitPts>=fitNeed()&&(SAVE.fitLv||0)<10){SAVE.fitPts-=fitNeed();SAVE.fitLv=(SAVE.fitLv||0)+1;toast('FITNESS LEVEL '+SAVE.fitLv+'. YOU WALK A BIT FASTER.');save()}
}
function gymTap(){
  if((SAVE.fitLv||0)>=10){toast('YOU ARE AS FIT AS YOU CAN GET.');return}
  SAVE.taps=(SAVE.taps||0)+1;addFit(SAVE.fed>0?1:.5);
}
function tapFire(){

function hubUpdate(dt){
  const sp=HUB.sp;HUB.t+=dt;
  HUB.acc+=dt/6;while(HUB.acc>=1){HUB.acc--;SAVE.day++;dayTick()}
  if(TOASTS.length){TOASTS[0].t-=dt;if(TOASTS[0].t<=0)TOASTS.shift()}
  if(HUB.fade>0)HUB.fade-=dt;
  checkUnlocks();
  // rooms open and close
  const cd=deckOf(sp.y);
  for(const r of ROOMS){
    const inside=!HUB.screen||true,here=cd===r.d&&sp.x>=r.x0&&sp.x<r.x1&&inside&&!(r.sh&&!r.sh.open());
    r.p+=((here?1:0)-r.p)*Math.min(1,dt*(here?5:2.2));if(Math.abs(r.p-(here?1:0))<.01)r.p=here?1:0;
  }
  // cat
  CAT.t+=dt;CAT.tele-=dt;
  if(CAT.tele<=0){CAT.tele=25+Math.random()*30;CAT.d=Math.floor(Math.random()*4);CAT.x=40+Math.random()*500}
  if(CAT.wait>0)CAT.wait-=dt;else{if(!CAT.vx&&Math.random()<.5){CAT.vx=(Math.random()<.5?-1:1)*9;CAT.go=.8+Math.random()*2.5}

  let dx=0,dy=0;
  if(UI.keys.arrowleft||UI.keys.a||PAD.x<0)dx=-1;else if(UI.keys.arrowright||UI.keys.d||PAD.x>0)dx=1;
  if(UI.keys.arrowup||UI.keys.w||PAD.y<0)dy=-1;else if(UI.keys.arrowdown||UI.keys.s||PAD.y>0)dy=1;
  if(dx||dy){sp.path=null;sp.pend=null}
  else if(sp.path&&sp.path.length){
    const p=sp.path[0],ax=p.x-sp.x,ay=p.y-sp.y;
    if(Math.abs(ax)>1.2)dx=Math.sign(ax);else if(Math.abs(ay)>1.2)dy=Math.sign(ay);
    else{sp.path.shift();if(!sp.path.length){sp.path=null;if(sp.pend){const q=sp.pend;sp.pend=null;q.fn()}}}
  }
  const onFloor=cd>=0;

  if(dx&&dy){mx*=.8;my*=.8}
  const ox=sp.x,oy=sp.y;
  if(mx&&walkable(sp.x+mx,sp.y))sp.x+=mx;
  if(my&&walkable(sp.x,sp.y+my))sp.y+=my;
  if(sp.path&&Math.abs(sp.x-ox)+Math.abs(sp.y-oy)<.001&&(dx||dy)){sp.stuck=(sp.stuck||0)+dt;if(sp.stuck>.4){sp.path=null;sp.pend=null;sp.stuck=0}}else sp.stuck=0;
  if(dx)sp.face=dx;
  if(sp.x!==ox||sp.y!==oy)sp.t+=dt;else sp.t=0;
  sp.climb=deckOf(sp.y)<0;
  if(Math.abs(sp.x-300)<=5)EL.y=deckOf(sp.y)>=0?FYd(deckOf(sp.y)):sp.y+3;
  const cx=Math.max(0,Math.min(WWID-W,sp.x-W/2)),cy=Math.max(0,Math.min(WH-H+4,sp.y-125));

  musVol(roomById('lounge').p>0||roomById('cafe').p>0||cd===1?.85:.45);
}

/* ===== soft muzak (generated) ===== */
let AC=null;const mus={on:true,step:0,next:0,in:null,gain:null,noise:null};
function musInit(){
  if(AC){if(AC.state==='suspended')AC.resume();return}
  try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null;return}
  mus.gain=AC.createGain();mus.gain.gain.value=0;mus.in=AC.createGain();mus.in.gain.value=1;
  const len=AC.sampleRate*2.4,buf=AC.createBuffer(2,len,AC.sampleRate);
  for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}
  const conv=AC.createConvolver();conv.buffer=buf;const wet=AC.createGain();wet.gain.value=.6;
  mus.in.connect(mus.gain);mus.in.connect(conv);conv.connect(wet);wet.connect(mus.gain);mus.gain.connect(AC.destination);
  const nb=AC.createBuffer(1,AC.sampleRate*.1,AC.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;mus.noise=nb;
  mus.next=AC.currentTime+.2;setInterval(musTick,100);
}
function musVol(v){if(AC&&mus.gain)mus.gain.gain.setTargetAtTime(mus.on?v*.55*(mus.vol||1):0,AC.currentTime,.4)}
const MCH=[[48,52,55,59,62],[45,48,52,55,59],[50,53,57,60,64],[43,47,53,57,64]],PENT=[64,67,69,72,74,76,79];
const mtof=m=>440*Math.pow(2,(m-69)/12);
function tone(t,m,dur,type,vol,att,rel){
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=mtof(m);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.setTargetAtTime(0,t+dur,rel/3);
  o.connect(g);g.connect(mus.in);o.start(t);o.stop(t+dur+rel+.3);
}
function musTick(){
  if(!AC)return;if(AC.state==='suspended'){AC.resume();return}
  const eighth=60/74/2;
  while(mus.next<AC.currentTime+.5){
    const st=mus.step++,t=mus.next,sub=st%8,ch=MCH[Math.floor(st/8)%4];
    if(sub===0){for(const n of ch){tone(t,n,3,'sine',.03,.6,2.2);tone(t,n+12,3,'triangle',.008,.8,2.4)}}
    if(sub===0||sub===4)tone(t,ch[0]-12,.5,'sine',.1,.02,.35);
    if(sub===3||sub===6){for(let i=1;i<4;i++)tone(t,ch[i]+12,.1,'sine',.016,.01,.6)}
    if([0,2,3,5,6].includes(sub)&&Math.random()<.4)tone(t,PENT[Math.floor(Math.random()*PENT.length)],.1,'triangle',.04,.01,.9);
    if(mus.noise){const s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();s.buffer=mus.noise;f.type='highpass';f.frequency.value=7000;
      g.gain.value=sub%2?.007:.012;s.connect(f);f.connect(g);g.connect(mus.in);s.start(t)}
    mus.next+=eighth;
  }
}

function padPoll(dt){

let AR=null;
function beep(f,d,type,v){

  g.gain.setTargetAtTime(0,AC.currentTime+d*.5,d*.25);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d+.15);

function mkBunker(x){

function bunkerHit(b,px,py){
  const lx=Math.floor(px-b.x),ly=Math.floor(py-b.y);
  if(lx<0||ly<0||lx>=b.w||ly>=b.h||!b.d[ly*b.w+lx])return false;

}
function arcadeStart(){
  AR={score:0,lives:3,wave:1,state:'play',t:0,conts:0,cd:0,x:160,bul:null,ib:[],ufo:null,ufoT:14,fireT:1.2,stepT:0,dir:1,frame:0,note:0,dead:0,clr:0,invT:0,extra:false,fx:[],pops:[],wt:1.4};

}
function arcadeWave(){
  AR.inv=[];for(let r=0;r<5;r++)for(let c=0;c<11;c++)AR.inv.push({r,c,a:true});
  AR.fx0=40;AR.fxp=40;AR.fy=28+Math.min(5,AR.wave-1)*8;AR.dir=1;AR.ib=[];AR.bul=null;AR.stepT=0;AR.wt=1.4;
  AR.bk=[];for(let i=0;i<4;i++)AR.bk.push(mkBunker(34+i*64));
}
const ivx=i=>AR.fxp+i.c*18+((18-AS.iv[IVROW[i.r]][0].width)>>1),ivy=i=>AR.fy+i.r*14;
function arcadeFire(){
  if(!AR)return;
  if(AR.state==='over'){if(AR.cd<8.8)arcadeContinue();return}
  if(AR.state!=='play'||AR.bul||AR.wt>0)return;
  AR.bul={x:AR.x,y:172};beep(900,.08,'square',.03);
}
function arcadeContinue(){
  if(AR.state!=='over')return;
  if((SAVE.credits||0)>=1)SAVE.credits--;
  else if(SAVE.coins>=5)SAVE.coins-=5;
  else{toast('NO CREDITS LEFT.');return}
  AR.conts++;AR.lives=3;AR.state='play';AR.bul=null;AR.ib=[];AR.invT=2;
  AR.fy=Math.max(28,AR.fy-40);AR.fx0=AR.fx0;save();
}
function arcadeExit(){
  const prize=Math.floor(AR.score/250);
  if(AR.score>(SAVE.arcadeHi||0))SAVE.arcadeHi=AR.score;
  if(prize>0){SAVE.coins+=prize;SAVE.earned+=prize}
  toast('ARCADE SCORE '+AR.score+(prize?'  PRIZE +'+prize+' GOLD':''));
  save();AR=null;MODE='hub';UI.focus=0;
}
function arcadeKey(k){
  if(!AR)return;
  if(k===' '||k==='enter'||k==='z'||k==='x'||k==='e'||k==='arrowup'||k==='w'){if(!INP.repeat||AR.state!=='over')arcadeFire()}
  else if(k==='escape'||k==='q'||k==='backspace'){if(AR.state==='over')arcadeExit();else{AR.state='over';AR.cd=10}}
}
function arcadeTick(dt){
  const A=AR;if(!A)return;A.t+=dt;
  if(TOASTS.length){TOASTS[0].t-=dt;if(TOASTS[0].t<=0)TOASTS.shift()}
  for(const f of A.fx){f.t-=dt;f.x+=f.vx*dt;f.y+=f.vy*dt}A.fx=A.fx.filter(f=>f.t>0);
  for(const p of A.pops)p.t-=dt;A.pops=A.pops.filter(p=>p.t>0);
  if(A.state==='over'){A.cd-=dt;if(A.cd<=0)arcadeExit();return}
  if(A.state==='dying'){A.dead-=dt;if(A.dead<=0){A.state=A.lives>0?'play':'over';A.cd=10;A.x=160;A.invT=1.5;A.ib=[]}return}
  if(A.state==='clear'){A.clr-=dt;if(A.clr<=0){A.wave++;arcadeWave();A.state='play'}return}

    A.bul.y-=260*dt;let gone=A.bul.y<18;
    if(!gone)for(const b of A.bk)if(bunkerHit(b,A.bul.x,A.bul.y)||bunkerHit(b,A.bul.x,A.bul.y+4)){gone=true;break}
    if(!gone)for(const i of alive){const w=AS.iv[IVROW[i.r]][0].width,x=ivx(i),y=ivy(i);
      if(A.bul.x>=x&&A.bul.x<=x+w&&A.bul.y>=y&&A.bul.y<=y+8){i.a=false;A.score+=IVPTS[IVROW[i.r]];gone=true;boomA(x+w/2,y+4,IVCOL[IVROW[i.r]]);beep(220,.12,'sawtooth',.04);break}}
    if(!gone&&A.ufo&&A.bul.x>=A.ufo.x&&A.bul.x<=A.ufo.x+16&&A.bul.y>=20&&A.bul.y<=30){
      const pts=[50,100,150,300][Math.floor(Math.random()*4)];A.score+=pts;A.pops.push({x:A.ufo.x,y:22,t:1.2,s:pts});boomA(A.ufo.x+8,25,'#ff7777');beep(140,.3,'sawtooth',.05);A.ufo=null;gone=true}
    if(gone)A.bul=null;

  const n=alive.length;
  if(!n){A.state='clear';A.clr=1.6;return}
  A.stepT+=dt;
  const iv=(0.03+n*.0065)/(1+.1*(A.wave-1));
  if(A.stepT>=iv){
    A.stepT=0;A.frame^=1;beep([110,98,87,82][A.note++%4],.07,'square',.03);
    let mn=99,mx=-1;for(const i of alive){if(i.c<mn)mn=i.c;if(i.c>mx)mx=i.c}

    for(const i of alive){const x=ivx(i),w=AS.iv[IVROW[i.r]][0].width,y=ivy(i);
      for(const b of A.bk)if(y+8>b.y&&y<b.y+b.h&&x+w>b.x&&x<b.x+b.w){for(let yy=0;yy<b.h;yy++)for(let xx=0;xx<b.w;xx++){const wx=b.x+xx,wy=b.y+yy;if(wx>=x&&wx<x+w&&wy>=y&&wy<y+8&&b.d[yy*b.w+xx]){b.d[yy*b.w+xx]=0;b.g.clearRect(xx,yy,1,1)}}}

  }

  }
  for(const b of A.ib){
    b.t+=dt;b.y+=(70+A.wave*6)*dt;let gone=b.y>184;

function boomA(x,y,col){for(let i=0;i<14;i++){const a=Math.random()*6.28,s=20+Math.random()*50;AR.fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:.35+Math.random()*.3,c:i&1?col:'#ffffff'})}}

/* ===== main loop ===== */
let last=performance.now(),acc=0,barShown=null;
function frame(now){
  const dt=Math.min(.1,Math.max(0,(now-last)/1000))||0;last=now;
  UI.list=[];UI.mouseOnly=null;padPoll(dt);
  if(MODE==='title'){
    const gp=(navigator.getGamepads?navigator.getGamepads():[])||[];for(const p of gp)if(p&&p.buttons.some(b=>b.pressed))startGame();
    drawTitle(now);
  }else if(MODE==='game'){
    acc+=dt*SPEED;let n=0;while(acc>=1/60&&n<600){update(1/60);acc-=1/60;n++}
    musVol(0);draw();
  }else if(MODE==='loot'){lootTick(dt);musVol(.2);drawLoot()}
  else if(MODE==='hub'){hubUpdate(dt);drawHub()}
  else if(MODE==='arcade'){arcadeTick(dt);musVol(.1);drawArcade()}
  const show=MODE==='game',tshow=isTouch&&(MODE==='hub'||MODE==='arcade'),mshow=MODE==='hub',key=(show?1:0)+(tshow?2:0)+(mshow?4:0);if(key!==barShown){barShown=key;document.getElementById('bar').style.display=show?'flex':'none';document.getElementById('touch').style.display=tshow?'flex':'none';document.getElementById('menu').style.display=mshow?'flex':'none';fit()}
  requestAnimationFrame(frame);
}

document.querySelectorAll('#menu button').forEach(b=>b.addEventListener('click',()=>{if(MODE!=='hub')return;const id=b.dataset.m;HUB.screen=HUB.screen===id?null:id;UI.focus=0}));
mus.on=SAVE.set.music!==0;mus.vol=[.4,.7,1][SAVE.set.vol]||1;applySettings();

setInterval(save,5000);
document.querySelectorAll('#bar button').forEach(b=>b.onclick=()=>{
  const sp=+b.dataset.sp,need=SPEED_NEED[sp];if(systemsDone()<need){if(MODE==='game'&&G){G.msg='X'+sp+' LOCKED. CLEAR '+need+(need>1?' SYSTEMS':' SYSTEM')+' FIRST';G.msgT=2.5}return}
  SPEED=sp;document.querySelectorAll('#bar button').forEach(x=>x.classList.toggle('on',x===b));
});
